<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动模板中心</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#172033}.wrap{max-width:1180px;margin:0 auto;padding:48px 28px 80px}.head{margin-bottom:30px}.head h1{font-size:34px;margin:0 0 10px}.head p{margin:0;color:#748095}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(31,42,68,.06)}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef4ff;color:#2f6feb;font-size:12px;margin-bottom:14px}.card h2{margin:0 0 8px;font-size:22px}.card p{margin:0 0 16px;color:#748095;line-height:1.7}.types{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.type{font-size:13px;padding:6px 10px;border-radius:7px;background:#f4f7ff;color:#315fa8;border:1px solid #dce7fb}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:9px;padding:11px 18px;border:1px solid #cfd7e4;color:#344054;background:#fff;font-weight:700}.btn.primary{background:#2f6feb;border-color:#2f6feb;color:#fff}.coming{opacity:.62}.foot{margin-top:28px;color:#8a94a6;font-size:13px}@media(max-width:640px){.wrap{padding:28px 16px 60px}.head h1{font-size:28px}}</style></head><body><div class="wrap"><div class="head"><h1>活动模板中心</h1><p>统一管理和预览各类活动模板，支持后台配置及 PC/H5 前端效果预览。</p></div><div class="grid"><div class="card"><span class="tag">已上线模板</span><h2>随机抽奖模板</h2><p>统一配置随机抽奖活动，共用奖品、中奖权重、抽奖机会、中奖资格、库存及中奖记录等核心能力，通过不同展示形式快速复用活动。</p><div class="types"><span class="type">大转盘</span><span class="type">礼盒抽奖</span><span class="type">后续可扩展：翻牌 / 财神 / 砸金蛋</span></div><div class="actions"><a class="btn primary" href="admin.html">后台管理</a><a class="btn" href="frontend.html">前端预览</a></div></div><div class="card coming"><span class="tag">后续扩展</span><h2>更多活动模板</h2><p>后续可继续扩展签到、任务、竞猜、助威等不同业务类型的活动模板，统一纳入活动模板中心管理。</p><div class="actions"><span class="btn">待接入</span></div></div></div><div class="foot">同一个 GitHub Pages 固定入口，后续更新文件即可保持链接长期不变。</div></div></body></html>
