<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="prototype.html"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;function replaceText(root){const w=d.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.nodeValue.includes('关联券模板'))n.nodeValue=n.nodeValue.replaceAll('关联券模板','关联奖励内容');if(n.nodeValue.includes('券模板'))n.nodeValue=n.nodeValue.replaceAll('券模板','奖励内容');}}replaceText(d.body);const obs=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)replaceText(n);else if(n.nodeType===3&&n.nodeValue.includes('券模板'))n.nodeValue=n.nodeValue.replaceAll('关联券模板','关联奖励内容').replaceAll('券模板','奖励内容');})));obs.observe(d.body,{childList:true,subtree:true});});</script></body></html>
