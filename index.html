<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="main-v3.html"></iframe><script>const app=document.getElementById('app');app.onload=()=>{try{const w=app.contentWindow,d=app.contentDocument,orig=w.openEditor;w.openEditor=function(edit){orig(edit);const ef=d.getElementById('editorFrame');const inject=()=>{try{const ed=ef.contentDocument;if(!ed||ed.getElementById('chanceComponentsScript'))return;const s=ed.createElement('script');s.id='chanceComponentsScript';s.src='chance-components.js?t='+Date.now();ed.body.appendChild(s)}catch(e){console.error(e)}};ef.addEventListener('load',()=>setTimeout(inject,80),{once:true})}}catch(e){console.error(e)}};</script></body></html>
