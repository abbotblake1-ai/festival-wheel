<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="main-v3.html"></iframe><script>const app=document.getElementById('app');app.onload=()=>{try{const w=app.contentWindow,d=app.contentDocument;const mg=d.createElement('script');mg.id='manualGiftScript';mg.src='manual-gift.js?t='+Date.now();d.body.appendChild(mg);const orig=w.openEditor;w.openEditor=function(edit){orig(edit);const ef=d.getElementById('editorFrame');const enhance=()=>{try{const ed=ef.contentDocument;if(!ed)return;const s=ed.createElement('script');s.id='allChanceMethodsScript';s.src='all-chance-methods.js?t='+Date.now();ed.body.appendChild(s);const p=ed.createElement('script');p.id='prizeConfigScript';p.src='prize-config.js?t='+Date.now();ed.body.appendChild(p);const applyVenueDropdown=()=>{const labels=[...ed.querySelectorAll('.field>label,.cc-field>label')];const label=labels.find(x=>x.textContent.replace('*','').trim()==='投注范围');if(!label)return;const field=label.parentElement;if(field.querySelector('select[data-venue-scope="1"]'))return;const oldSelect=field.querySelector('select');if(oldSelect){oldSelect.dataset.venueScope='1';oldSelect.classList.add(field.classList.contains('cc-field')?'cc-select':'select');return}const radios=[...field.querySelectorAll('input[type="radio"]')];let selected='all';radios.forEach(r=>{if(r.checked&&/指定/.test(r.parentElement?.textContent||''))selected='specified'});[...field.children].slice(1).forEach(x=>x.remove());const sel=ed.createElement('select');sel.className=field.classList.contains('cc-field')?'cc-select':'select';sel.dataset.venueScope='1';sel.innerHTML='<option value="all">全部场馆</option><option value="specified">指定场馆</option>';sel.value=selected;const venues=ed.createElement('div');venues.className=field.classList.contains('cc-field')?'cc-subbox':'venue-row';venues.style.display=selected==='specified'?'block':'none';venues.innerHTML='<div style="margin-bottom:10px;font-weight:600">指定场馆（可多选）</div><div style="display:flex;gap:20px;flex-wrap:wrap"><label class="check"><input type="checkbox">体育</label><label class="check"><input type="checkbox">电子</label><label class="check"><input type="checkbox">电竞</label><label class="check"><input type="checkbox">彩票</label><label class="check"><input type="checkbox">捕鱼</label><label class="check"><input type="checkbox">真人</label></div>';sel.onchange=()=>venues.style.display=sel.value==='specified'?'block':'none';field.appendChild(sel);field.appendChild(venues)};const run=()=>setTimeout(applyVenueDropdown,0);run();const body=ed.getElementById('body');if(body&&!body.dataset.venueObserver){body.dataset.venueObserver='1';new MutationObserver(run).observe(body,{childList:true,subtree:true})}}catch(e){console.error(e)}};ef.addEventListener('load',()=>setTimeout(enhance,100),{once:true})}}catch(e){console.error(e)}};</script></body></html>
