<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v3.html?v=202608110251"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;const css=d.createElement('style');css.textContent=`.basic-prod{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:30px 36px}.basic-row{display:grid;grid-template-columns:180px minmax(520px,820px);gap:20px;align-items:start;margin-bottom:24px}.basic-label{text-align:right;font-size:15px;font-weight:600;line-height:42px;color:#344054}.basic-label .req{color:#f04438;margin-right:4px}.basic-control{width:100%;height:42px;border:1px solid #d0d5dd;border-radius:7px;padding:0 14px;font-size:14px;background:#fff;color:#344054}.basic-textarea{height:120px;padding:12px 14px;resize:vertical}.basic-time{display:flex;align-items:center;gap:10px}.basic-time input{flex:1}.basic-sep{color:#98a2b3}.basic-hint{font-size:12px;color:#98a2b3;margin-top:6px}@media(max-width:900px){.basic-row{grid-template-columns:1fr}.basic-label{text-align:left;line-height:1.4}}`;d.head.appendChild(css);function basicHtml(){return `<div class="basic-prod" data-basic-prod="1"><div class="basic-row"><div class="basic-label"><span class="req">*</span>活动名称</div><div><input class="basic-control" placeholder="请输入活动名称" value="国庆大转盘"></div></div><div class="basic-row"><div class="basic-label"><span class="req">*</span>活动进行时间</div><div><div class="basic-time"><input class="basic-control" type="datetime-local" value="2026-10-01T00:00"><span class="basic-sep">—</span><input class="basic-control" type="datetime-local" value="2026-10-07T23:59"></div><div class="basic-hint">控制会员实际参与活动及累计数据的时间范围。</div></div></div><div class="basic-row"><div class="basic-label"><span class="req">*</span>活动上架时间</div><div><input class="basic-control" type="datetime-local" value="2026-09-30T12:00"><div class="basic-hint">到达上架时间后活动才在前端展示；上架时间可早于活动开始时间。</div></div></div><div class="basic-row"><div class="basic-label">活动说明</div><div><textarea class="basic-control basic-textarea" placeholder="请输入活动说明">国庆节幸运大转盘活动</textarea></div></div></div>`}function sync(){const active=d.querySelector('.step.on');const box=d.getElementById('stepBody');if(!active||!box)return;if(active.textContent.includes('基础信息')&&!box.querySelector('[data-basic-prod]'))box.innerHTML=basicHtml()}d.addEventListener('click',()=>setTimeout(sync,0),true);new MutationObserver(()=>setTimeout(sync,0)).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});sync();});</script></body></html>
