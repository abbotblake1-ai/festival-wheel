<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="prototype-vip.html?v=202608110150"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const css=d.createElement('style');css.textContent='.asset-section{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:start;padding:22px 0;border-bottom:1px solid #eaecf0}.asset-label{font-size:15px;font-weight:700;padding-top:18px}.req{color:#d92d20;margin-right:5px}.upload-pair{border:1px dashed #bfd0e5;border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:24px;background:#fbfcfe}.upload-box{height:138px;border-radius:10px;background:#eef0f4;border:1px solid #e0e3e8;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:17px;font-weight:700;cursor:pointer}.upload-box:hover{border-color:#84adff;background:#f4f7ff;color:#175cd3}.upload-box.done{background:#ecfdf3;border-color:#abefc6;color:#027a48}.upload-hint{text-align:center;color:#98a2b3;margin-top:10px;font-size:13px}.subhead{font-size:15px;font-weight:700;margin:22px 0 4px;padding-left:10px;border-left:3px solid #2563eb;color:#344054}';d.head.appendChild(css);function row(label,key,max){return `<div class="asset-section"><div class="asset-label"><span class="req">*</span>${label}</div><div class="upload-pair"><div><div class="upload-box" data-upload="${key}-h5">＋ 上传 APP/H5</div><div class="upload-hint">图片格式推荐：jpg、png，大小不大于${max}M</div></div><div><div class="upload-box" data-upload="${key}-web">＋ 上传 Web</div><div class="upload-hint">图片格式推荐：jpg、png，大小不大于${max}M</div></div></div></div>`}function decoration(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="notice"><b>上传规则：</b>APP/H5 与 Web 分开上传；两端均为必填，前端根据终端读取对应图片，上传后支持替换。</div>${row('活动内页顶部图','top',2)}${row('活动背景图','bg',4)}<div class="subhead">幸运大转盘素材</div>${row('幸运大转盘底座','base',2)}${row('大转盘外圈','outer',2)}${row('大转盘','wheel',2)}${row('指针','pointer',2)}${row('大转盘背景图','wheelbg',4)}<div class="subhead">其他模块素材</div>${row('获得抽奖机会背景图','chance',4)}${row('我的抽奖机会','mine',2)}${row('奖品展示','prizes',2)}</div></div>`}let replacing=false;function sync(){if(replacing)return;const active=d.querySelector('.step.on');const box=d.getElementById('stepBody');if(!active||!box||!active.textContent.includes('页面装修'))return;if(box.querySelector('[data-decoration-v2]'))return;replacing=true;box.innerHTML=`<div data-decoration-v2="1">${decoration()}</div>`;replacing=false}d.addEventListener('click',e=>{const u=e.target.closest('[data-upload]');if(u){u.classList.add('done');u.textContent='✓ 已上传（点击替换）';return}setTimeout(sync,0)},true);const obs=new MutationObserver(()=>setTimeout(sync,0));obs.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});sync();});</script></body></html>
