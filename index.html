<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="main-v3.html"></iframe><script>const app=document.getElementById('app');app.onload=()=>{try{const w=app.contentWindow,d=app.contentDocument,orig=w.openEditor;w.openEditor=function(edit){orig(edit);const ef=d.getElementById('editorFrame');const enhance=()=>{try{const ed=ef.contentDocument;if(!ed)return;const applyVenueDropdown=()=>{const labels=[...ed.querySelectorAll('.field>label')];const label=labels.find(x=>x.textContent.replace('*','').trim()==='投注范围');if(!label)return;const field=label.parentElement;if(field.dataset.scopeDropdown==='1')return;field.dataset.scopeDropdown='1';[...field.children].slice(1).forEach(x=>x.remove());const sel=ed.createElement('select');sel.className='select';sel.id='venueScopeSelect';sel.innerHTML='<option value="all">全部场馆</option><option value="specified">指定场馆</option>';const venues=ed.createElement('div');venues.id='venues';venues.className='venue-row';venues.style.display='none';venues.innerHTML='<label class="check"><input type="checkbox">体育</label><label class="check"><input type="checkbox">电子</label><label class="check"><input type="checkbox">电竞</label><label class="check"><input type="checkbox">彩票</label><label class="check"><input type="checkbox">捕鱼</label><label class="check"><input type="checkbox">真人</label>';sel.onchange=()=>venues.style.display=sel.value==='specified'?'flex':'none';field.appendChild(sel);field.appendChild(venues)};applyVenueDropdown();const body=ed.getElementById('body');if(body&&!body.dataset.venueObserver){body.dataset.venueObserver='1';new MutationObserver(()=>setTimeout(applyVenueDropdown,0)).observe(body,{childList:true,subtree:true})}}catch(e){console.error(e)}};ef.addEventListener('load',()=>setTimeout(enhance,100),{once:true})}}catch(e){console.error(e)}};</script></body></html>
