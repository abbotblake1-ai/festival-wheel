<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="prototype-vip.html"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const css=d.createElement('style');css.textContent='.asset-section{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start;padding:22px 0;border-bottom:1px solid #eaecf0}.asset-section:last-child{border-bottom:0}.asset-label{font-size:15px;font-weight:700;padding-top:18px}.asset-label .req{color:#d92d20;margin-right:5px}.upload-pair{border:1px dashed #bfd0e5;border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:24px;background:#fbfcfe}.upload-slot{min-width:0}.upload-box{height:138px;border-radius:10px;background:#eef0f4;border:1px solid #e0e3e8;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:18px;font-weight:700;cursor:pointer;transition:.15s}.upload-box:hover{border-color:#84adff;background:#f4f7ff;color:#175cd3}.upload-box.done{background:#ecfdf3;border-color:#abefc6;color:#027a48}.upload-hint{text-align:center;color:#98a2b3;margin-top:10px;font-size:13px}.subhead{font-size:15px;font-weight:700;margin:22px 0 4px;padding-left:10px;border-left:3px solid #2563eb;color:#344054}@media(max-width:900px){.asset-section{grid-template-columns:1fr}.upload-pair{grid-template-columns:1fr}}';d.head.appendChild(css);w.assetRow=function(label,key,maxMb){return `<div class="asset-section"><div class="asset-label"><span class="req">*</span>${label}</div><div class="upload-pair"><div class="upload-slot"><div class="upload-box" id="${key}_h5" onclick="mockAssetUpload('${key}_h5','APP/H5')">＋ 上传 APP/H5</div><div class="upload-hint">图片格式推荐：jpg、png，大小不大于${maxMb}M</div></div><div class="upload-slot"><div class="upload-box" id="${key}_web" onclick="mockAssetUpload('${key}_web','Web')">＋ 上传 Web</div><div class="upload-hint">图片格式推荐：jpg、png，大小不大于${maxMb}M</div></div></div></div>`};w.pageDecoration=function(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="notice"><b>上传规则：</b>APP/H5 与 Web 分开上传；前端根据当前终端读取对应图片。两端图片均为必填，支持上传后替换。</div>${w.assetRow('活动内页顶部图','top',2)}${w.assetRow('活动背景图','background',4)}<div class="subhead">幸运大转盘素材</div>${w.assetRow('幸运大转盘底座','wheel_base',2)}${w.assetRow('大转盘外圈','wheel_outer',2)}${w.assetRow('大转盘','wheel_body',2)}${w.assetRow('指针','wheel_pointer',2)}${w.assetRow('大转盘背景图','wheel_background',4)}<div class="subhead">其他模块素材</div>${w.assetRow('获得抽奖机会背景图','chance_background',4)}${w.assetRow('我的抽奖机会图','my_chance',2)}${w.assetRow('奖品展示图','prize_display',2)}</div></div>`};w.mockAssetUpload=function(id,terminal){const el=d.getElementById(id);if(!el)return;el.classList.add('done');el.textContent='✓ '+terminal+' 已上传（点击替换）';if(w.toast)w.toast(terminal+' 图片上传成功（原型演示）')};});</script></body></html>
