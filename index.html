<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v6.html?v=202608110325"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;const css=d.createElement('style');css.textContent=`.pm-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.pm-tools .input{width:220px}.pm-modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:99}.pm-box{width:720px;background:#fff;border-radius:8px;box-shadow:0 20px 60px #0003}.pm-h{padding:18px 22px;border-bottom:1px solid #eee;font-size:18px;font-weight:700;display:flex;justify-content:space-between}.pm-b{padding:22px}.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pm-field{margin-bottom:16px}.pm-field label{display:block;font-weight:600;margin-bottom:7px}.pm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.pm-upload{height:86px;border:1px dashed #91caff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#1677ff;cursor:pointer;background:#fafcff}.pm-upload.done{color:#52c41a;border-color:#b7eb8f;background:#f6ffed}.pm-empty{text-align:center;color:#999;padding:34px}.pm-danger{color:#ff4d4f}.pm-status-btn{min-width:60px}`;d.head.appendChild(css);let prizes=[{id:'P001',name:'88元现金券',type:'现金券',img:true,status:'启用',used:true},{id:'P002',name:'50元存送券',type:'存送券',img:true,status:'启用',used:false},{id:'P003',name:'30元流水券',type:'流水券',img:true,status:'启用',used:false}];let editing=null,keyword='',typeFilter='全部',statusFilter='全部';function prizeHtml(){return `<div class="content"><div class="headrow"><div><div class="title">奖品管理</div><div class="muted">运营管理 / 活动配置管理 / 奖品管理</div></div><button class="btn primary" id="pmAdd">＋ 新增奖品</button></div><div class="panel"><div class="notice">公共奖品库：只维护奖品名称、奖品类型、奖品图片、状态。活动库存、概率、VIP范围、有效期、流水等在具体活动的“奖品配置”中设置。</div><div class="pm-tools"><span>奖品名称</span><input id="pmKeyword" class="input" placeholder="请输入奖品名称"><span>奖品类型</span><select id="pmType" class="select"><option>全部</option><option>现金券</option><option>存送券</option><option>流水券</option></select><span>状态</span><select id="pmStatus" class="select"><option>全部</option><option>启用</option><option>停用</option></select><button class="btn primary" id="pmSearch">搜索</button><button class="btn" id="pmReset">重置</button></div><table class="table"><thead><tr><th>奖品ID</th><th>奖品名称</th><th>奖品类型</th><th>奖品图片</th><th>状态</th><th>操作</th></tr></thead><tbody id="pmBody"></tbody></table></div></div><div class="pm-modal" id="pmModal"><div class="pm-box"><div class="pm-h"><span id="pmTitle">新增奖品</span><span id="pmClose" style="cursor:pointer">×</span></div><div class="pm-b"><div class="pm-grid"><div class="pm-field"><label>奖品名称 *</label><input id="pmName" class="input full" placeholder="请输入奖品名称"></div><div class="pm-field"><label>奖品类型 *</label><select id="pmEditType" class="select full"><option>现金券</option><option>存送券</option><option>流水券</option></select></div><div class="pm-field"><label>状态</label><select id="pmEditStatus" class="select full"><option>启用</option><option>停用</option></select></div><div class="pm-field"><label>奖品图片</label><div id="pmUpload" class="pm-upload">＋ 上传奖品图片</div></div></div><div class="muted">奖品ID由系统自动生成，不可编辑。奖品被活动引用后，不允许删除。</div><div class="pm-actions"><button class="btn" id="pmCancel">取消</button><button class="btn primary" id="pmSave">保存</button></div></div></div></div>`}function filtered(){return prizes.filter(p=>(!keyword||p.name.includes(keyword))&&(typeFilter==='全部'||p.type===typeFilter)&&(statusFilter==='全部'||p.status===statusFilter))}function renderRows(){const body=d.getElementById('pmBody');if(!body)return;const arr=filtered();body.innerHTML=arr.length?arr.map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.type}</td><td>${p.img?'已上传':'未上传'}</td><td><span class="status ${p.status==='停用'?'off':''}">${p.status}</span></td><td><div class="ops"><button class="btn link" data-pm-edit="${p.id}">编辑</button><button class="btn ${p.status==='启用'?'danger':'green'} pm-status-btn" data-pm-toggle="${p.id}">${p.status==='启用'?'停用':'启用'}</button><button class="btn danger" data-pm-del="${p.id}">删除</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="pm-empty">暂无符合条件的奖品</td></tr>`}function ensurePrize(){const pg=d.getElementById('prizePage');if(!pg||pg.dataset.crud==='1')return;pg.dataset.crud='1';pg.innerHTML=prizeHtml();bind();renderRows()}function bind(){d.getElementById('pmAdd').onclick=()=>openModal();d.getElementById('pmClose').onclick=closeModal;d.getElementById('pmCancel').onclick=closeModal;d.getElementById('pmSearch').onclick=()=>{keyword=d.getElementById('pmKeyword').value.trim();typeFilter=d.getElementById('pmType').value;statusFilter=d.getElementById('pmStatus').value;renderRows()};d.getElementById('pmReset').onclick=()=>{keyword='';typeFilter='全部';statusFilter='全部';d.getElementById('pmKeyword').value='';d.getElementById('pmType').value='全部';d.getElementById('pmStatus').value='全部';renderRows()};d.getElementById('pmUpload').onclick=e=>{e.currentTarget.classList.add('done');e.currentTarget.textContent='✓ 已上传（点击替换）'};d.getElementById('pmSave').onclick=savePrize;d.addEventListener('click',handleTable,true)}function handleTable(e){const edit=e.target.closest('[data-pm-edit]');if(edit){openModal(edit.dataset.pmEdit);return}const tog=e.target.closest('[data-pm-toggle]');if(tog){const p=prizes.find(x=>x.id===tog.dataset.pmToggle);p.status=p.status==='启用'?'停用':'启用';renderRows();return}const del=e.target.closest('[data-pm-del]');if(del){const p=prizes.find(x=>x.id===del.dataset.pmDel);if(p.used){alert('该奖品已被活动关联，暂不可删除');return}if(confirm('确认删除奖品「'+p.name+'」吗？')){prizes=prizes.filter(x=>x.id!==p.id);renderRows()}return}}function openModal(id){editing=id||null;const p=id?prizes.find(x=>x.id===id):null;d.getElementById('pmTitle').textContent=id?'编辑奖品':'新增奖品';d.getElementById('pmName').value=p?p.name:'';d.getElementById('pmEditType').value=p?p.type:'现金券';d.getElementById('pmEditStatus').value=p?p.status:'启用';const up=d.getElementById('pmUpload');up.className='pm-upload'+(p&&p.img?' done':'');up.textContent=p&&p.img?'✓ 已上传（点击替换）':'＋ 上传奖品图片';d.getElementById('pmModal').style.display='flex'}function closeModal(){d.getElementById('pmModal').style.display='none'}function savePrize(){const name=d.getElementById('pmName').value.trim();if(!name){alert('请输入奖品名称');return}const type=d.getElementById('pmEditType').value,status=d.getElementById('pmEditStatus').value,img=d.getElementById('pmUpload').classList.contains('done');if(editing){const p=prizes.find(x=>x.id===editing);p.name=name;p.type=type;p.status=status;p.img=img}else{const n=Math.max(...prizes.map(x=>+x.id.replace('P','')),0)+1;prizes.push({id:'P'+String(n).padStart(3,'0'),name,type,status,img,used:false})}closeModal();renderRows()}const oldShow=w.showPrize;w.showPrize=function(){if(oldShow)oldShow();setTimeout(ensurePrize,0)};d.addEventListener('click',e=>{if(e.target&&e.target.id==='navPrize')setTimeout(ensurePrize,0)},true);new MutationObserver(()=>{const pg=d.getElementById('prizePage');if(pg&&getComputedStyle(pg).display!=='none')ensurePrize()}).observe(d.body,{subtree:true,attributes:true,attributeFilter:['style','class']});});</script></body></html>
