<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="app-v3.html?v=202608110305"></iframe><script>const root=document.getElementById('app');function basicHtml(){return `<div data-basic-prod="1" class="card"><div class="card-h">基础信息</div><div class="card-b"><div style="max-width:1180px;padding:12px 0;display:grid;grid-template-columns:170px 1fr;gap:24px 20px;align-items:center"><div style="font-weight:600;text-align:right"><span style="color:#f04438">*</span> 活动名称</div><input class="input" style="width:100%;height:42px" placeholder="请输入活动名称"><div style="font-weight:600;text-align:right"><span style="color:#f04438">*</span> 活动进行时间</div><div style="display:flex;align-items:center;gap:10px"><input class="input" style="width:280px;height:42px" placeholder="开始时间"><span style="color:#98a2b3">—</span><input class="input" style="width:280px;height:42px" placeholder="结束时间"></div><div style="font-weight:600;text-align:right"><span style="color:#f04438">*</span> 活动上架时间</div><input class="input" style="width:570px;height:42px" placeholder="选择时间"><div style="font-weight:600;text-align:right;align-self:start;padding-top:10px">活动说明</div><textarea style="width:100%;min-height:110px;border:1px solid #d0d5dd;border-radius:7px;padding:12px;font:inherit" placeholder="请输入活动说明"></textarea></div></div></div>`}function patch(){try{const d1=root.contentDocument;if(!d1)return;const editor=d1.getElementById('editorFrame');if(!editor||!editor.contentDocument)return;const d2=editor.contentDocument,inner=d2.getElementById('app');if(!inner||!inner.contentDocument)return;const d=inner.contentDocument,active=[...d.querySelectorAll('.step')].find(x=>x.classList.contains('on')),box=d.getElementById('stepBody');if(active&&box&&active.textContent.includes('基础信息')&&!box.querySelector('[data-basic-prod]'))box.innerHTML=basicHtml()}catch(e){}}setInterval(patch,250);</script></body></html>
