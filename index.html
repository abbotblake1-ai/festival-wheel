<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="prototype-vip.html?v=202608110205"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;const css=d.createElement('style');css.textContent=`.asset-section{display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:start;padding:22px 0;border-bottom:1px solid #eaecf0}.asset-label{font-size:15px;font-weight:700;padding-top:18px}.req{color:#d92d20;margin-right:5px}.upload-pair{border:1px dashed #bfd0e5;border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:24px;background:#fbfcfe}.upload-box{height:138px;border-radius:10px;background:#eef0f4;border:1px solid #e0e3e8;display:flex;align-items:center;justify-content:center;color:#98a2b3;font-size:17px;font-weight:700;cursor:pointer}.upload-box:hover{border-color:#84adff;background:#f4f7ff;color:#175cd3}.upload-box.done{background:#ecfdf3;border-color:#abefc6;color:#027a48}.upload-hint{text-align:center;color:#98a2b3;margin-top:10px;font-size:13px}.subhead{font-size:15px;font-weight:700;margin:22px 0 4px;padding-left:10px;border-left:3px solid #2563eb;color:#344054}.chance-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.chance-method{border:1px solid #e4e7ec;border-radius:10px;padding:16px;background:#fff}.chance-method.on{border-color:#84adff;background:#f8faff}.chance-method-top{display:flex;align-items:center;justify-content:space-between}.chance-method-title{font-size:16px;font-weight:700}.chance-method-desc{font-size:12px;color:#667085;margin-top:7px;line-height:1.6}.sw{width:42px;height:23px;border-radius:99px;background:#d0d5dd;position:relative;cursor:pointer;flex:none}.sw:after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px #0002;transition:.15s}.sw.on{background:#2563eb}.sw.on:after{left:21px}.chance-tabs{display:flex;border-bottom:1px solid #eaecf0;margin-bottom:18px}.chance-tab{padding:11px 22px;cursor:pointer;color:#667085;border-bottom:2px solid transparent;font-weight:600}.chance-tab.on{color:#2563eb;border-bottom-color:#2563eb}.config-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:15px;background:#f9fafb;border:1px solid #eaecf0;border-radius:9px;margin-bottom:15px}.mini-label{font-size:12px;color:#667085;margin-bottom:6px}.chance-table input,.chance-table select{width:110px;border:1px solid #d0d5dd;border-radius:6px;padding:7px 8px;background:#fff}.chance-actions{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.preview-note{margin-top:14px;padding:12px 14px;border-radius:8px;background:#fffaeb;border:1px solid #fedf89;color:#7a5b13;font-size:13px;line-height:1.7}.method-disabled{opacity:.45;pointer-events:none}.login-config{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:15px;background:#f9fafb;border:1px solid #eaecf0;border-radius:9px;margin-bottom:15px}@media(max-width:1000px){.chance-methods,.config-bar,.login-config,.upload-pair{grid-template-columns:1fr}}`;d.head.appendChild(css);let methodState={bet:true,recharge:true,login:true};let activeChance='bet';let betRows=[[100,1],[500,5],[1000,12],[3000,40],[5000,80],[10000,200]];let rechargeRows=[[100,1],[500,6],[1000,15],[3000,50],[5000,100]];let loginRows=[[1,1],[3,2],[5,3],[7,5]];function swHtml(k){return `<div class="sw ${methodState[k]?'on':''}" data-method-switch="${k}"></div>`}function chanceCard(k,title,desc){return `<div class="chance-method ${methodState[k]?'on':''}"><div class="chance-method-top"><div class="chance-method-title">${title}</div>${swHtml(k)}</div><div class="chance-method-desc">${desc}</div></div>`}function rowsHtml(type){const rows=type==='bet'?betRows:rechargeRows;const first=type==='bet'?'有效投注金额（元）':'累计充值金额（元）';return `<table class="table chance-table"><thead><tr><th>档位</th><th>${first}</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><input type="number" value="${r[0]}" data-tier-amount="${type}-${i}"></td><td><input type="number" value="${r[1]}" data-tier-count="${type}-${i}"> 次</td><td><button class="btn small danger" data-del-tier="${type}-${i}">删除</button></td></tr>`).join('')}</tbody></table>`}function loginRowsHtml(){return `<table class="table chance-table"><thead><tr><th>档位</th><th>连续登录天数</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody>${loginRows.map((r,i)=>`<tr><td>${i+1}</td><td><input type="number" value="${r[0]}" data-login-day="${i}"> 天</td><td><input type="number" value="${r[1]}" data-login-count="${i}"> 次</td><td><button class="btn small danger" data-del-login="${i}">删除</button></td></tr>`).join('')}</tbody></table>`}function methodPanel(){if(activeChance==='bet')return `<div class="${methodState.bet?'':'method-disabled'}"><div class="config-bar"><div><div class="mini-label">统计口径</div><select class="select"><option>活动期间累计有效投注</option><option>每日累计有效投注</option></select></div><div><div class="mini-label">投注范围</div><select class="select"><option>全部场馆</option><option>指定场馆</option></select></div><div><div class="mini-label">每日赠送次数上限</div><input class="input" value="200" type="number"></div></div><div class="chance-actions"><span class="muted">达到多个档位时，各档位按配置分别赠送对应抽奖次数。</span><button class="btn primary small" data-add-tier="bet">＋ 新增档位</button></div>${rowsHtml('bet')}<div class="preview-note"><b>前端对应：</b>「投注赠送」Tab，展示有效投注、赠送次数、当前进度；会员达到档位后显示可领取/未达标。</div></div>`;if(activeChance==='recharge')return `<div class="${methodState.recharge?'':'method-disabled'}"><div class="config-bar"><div><div class="mini-label">统计口径</div><select class="select"><option>活动期间累计充值</option><option>每日累计充值</option></select></div><div><div class="mini-label">充值范围</div><select class="select"><option>全部充值渠道</option><option>指定充值渠道</option></select></div><div><div class="mini-label">每日赠送次数上限</div><input class="input" value="200" type="number"></div></div><div class="chance-actions"><span class="muted">支持多个充值档位；满足档位后赠送对应抽奖次数。</span><button class="btn primary small" data-add-tier="recharge">＋ 新增档位</button></div>${rowsHtml('recharge')}<div class="preview-note"><b>前端对应：</b>「充值赠送」Tab，展示有效充值、赠送次数、当前进度，并提供“立即充值”入口。</div></div>`;return `<div class="${methodState.login?'':'method-disabled'}"><div class="login-config"><div><div class="mini-label">登录计算方式</div><select class="select"><option>连续登录</option><option>累计登录</option></select></div><div><div class="mini-label">活动期间最多赠送</div><input class="input" value="11" type="number"></div></div><div class="chance-actions"><span class="muted">按登录天数配置多个节点，每个节点可赠送不同抽奖次数。</span><button class="btn primary small" data-add-login>＋ 新增登录节点</button></div>${loginRowsHtml()}<div class="preview-note"><b>前端对应：</b>「每日登录」Tab，展示连续登录天数、赠送次数、当前进度，并提供“立即登录”入口。</div></div>`}function chanceConfig(){return `<div class="card"><div class="card-h"><span>获取抽奖机会</span><span class="muted">配置项与前端三个Tab一一对应</span></div><div class="card-b"><div class="notice"><b>配置说明：</b>投注赠送、充值赠送、每日登录可独立开启/关闭；开启后前端展示对应Tab。每种方式分别维护自己的档位和赠送次数。</div><div class="chance-methods">${chanceCard('bet','投注赠送','会员达到指定有效投注金额后，获得对应抽奖次数。支持多个档位。')}${chanceCard('recharge','充值赠送','会员达到指定充值金额后，获得对应抽奖次数。支持多个档位。')}${chanceCard('login','每日登录','按连续/累计登录天数设置奖励节点，达到节点获得抽奖次数。')}</div><div class="chance-tabs"><div class="chance-tab ${activeChance==='bet'?'on':''}" data-chance-tab="bet">投注赠送</div><div class="chance-tab ${activeChance==='recharge'?'on':''}" data-chance-tab="recharge">充值赠送</div><div class="chance-tab ${activeChance==='login'?'on':''}" data-chance-tab="login">每日登录</div></div><div id="chancePanel">${methodPanel()}</div></div></div>`}function row(label,key,max){return `<div class="asset-section"><div class="asset-label"><span class="req">*</span>${label}</div><div class="upload-pair"><div><div class="upload-box" data-upload="${key}-h5">＋ 上传 APP/H5</div><div class="upload-hint">图片格式推荐：jpg、png，大小不大于${max}M</div></div><div><div class="upload-box" data-upload="${key}-web">＋ 上传 Web</div><div class="upload-hint">图片格式推荐：jpg、png，大小不大于${max}M</div></div></div></div>`}function decoration(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="notice"><b>上传规则：</b>APP/H5 与 Web 分开上传；两端均为必填，前端根据终端读取对应图片，上传后支持替换。</div>${row('活动内页顶部图','top',2)}${row('活动背景图','bg',4)}<div class="subhead">幸运大转盘素材</div>${row('幸运大转盘底座','base',2)}${row('大转盘外圈','outer',2)}${row('大转盘','wheel',2)}${row('指针','pointer',2)}${row('大转盘背景图','wheelbg',4)}<div class="subhead">其他模块素材</div>${row('获得抽奖机会背景图','chance',4)}${row('我的抽奖机会','mine',2)}${row('奖品展示','prizes',2)}</div></div>`}let replacing=false;function sync(){if(replacing)return;const active=d.querySelector('.step.on');const box=d.getElementById('stepBody');if(!active||!box)return;replacing=true;if(active.textContent.includes('获取抽奖机会')){if(!box.querySelector('[data-chance-v3]'))box.innerHTML=`<div data-chance-v3="1">${chanceConfig()}</div>`}else if(active.textContent.includes('页面装修')){if(!box.querySelector('[data-decoration-v2]'))box.innerHTML=`<div data-decoration-v2="1">${decoration()}</div>`}replacing=false}function rerenderChance(){const box=d.querySelector('[data-chance-v3]');if(box)box.innerHTML=chanceConfig()}d.addEventListener('click',e=>{const sw=e.target.closest('[data-method-switch]');if(sw){const k=sw.dataset.methodSwitch;methodState[k]=!methodState[k];rerenderChance();return}const tab=e.target.closest('[data-chance-tab]');if(tab){activeChance=tab.dataset.chanceTab;rerenderChance();return}const add=e.target.closest('[data-add-tier]');if(add){const arr=add.dataset.addTier==='bet'?betRows:rechargeRows;arr.push([0,1]);rerenderChance();return}if(e.target.closest('[data-add-login]')){loginRows.push([1,1]);rerenderChance();return}const del=e.target.closest('[data-del-tier]');if(del){const [type,idx]=del.dataset.delTier.split('-');(type==='bet'?betRows:rechargeRows).splice(+idx,1);rerenderChance();return}const dl=e.target.closest('[data-del-login]');if(dl){loginRows.splice(+dl.dataset.delLogin,1);rerenderChance();return}const u=e.target.closest('[data-upload]');if(u){u.classList.add('done');u.textContent='✓ 已上传（点击替换）';return}setTimeout(sync,0)},true);d.addEventListener('input',e=>{let m=e.target.dataset.tierAmount;if(m){let [t,i]=m.split('-');(t==='bet'?betRows:rechargeRows)[+i][0]=+e.target.value}m=e.target.dataset.tierCount;if(m){let [t,i]=m.split('-');(t==='bet'?betRows:rechargeRows)[+i][1]=+e.target.value}if(e.target.dataset.loginDay!==undefined)loginRows[+e.target.dataset.loginDay][0]=+e.target.value;if(e.target.dataset.loginCount!==undefined)loginRows[+e.target.dataset.loginCount][1]=+e.target.value});const obs=new MutationObserver(()=>setTimeout(sync,0));obs.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});sync();});</script></body></html>
