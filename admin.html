<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>随机抽奖模板后台管理系统</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="main-v3.html"></iframe><script>
const app=document.getElementById('app');
app.onload=()=>{
  try{
    const outerDoc=app.contentDocument;
    const mainFrame=outerDoc.getElementById('main');
    if(!mainFrame) return;
    const installIntoMain=()=>{
      try{
        const mainDoc=mainFrame.contentDocument;
        if(!mainDoc) return;
        const ensureGiftActivity=()=>{
          try{
            const table=mainDoc.querySelector('#list table.table');
            const tbody=table&&table.querySelector('tbody');
            if(!tbody) return;
            const exists=[...tbody.querySelectorAll('tr')].some(tr=>tr.textContent.includes('国庆礼盒抽奖'));
            if(!exists){
              const tr=mainDoc.createElement('tr');
              tr.innerHTML='<td>202610010001005 (5)</td><td><span class="status">开启中</span></td><td>礼盒抽奖</td><td><a href="javascript:void(0)" class="gift-edit-link" style="color:#1677ff">国庆礼盒抽奖</a></td><td>2026-09-28 11:00:00</td><td>2026-10-01 00:00:00</td><td><div class="ops"><button class="btn danger">禁用</button><button class="btn link gift-edit-btn">编辑信息</button><button class="btn gift-chance-btn" style="color:#722ed1;border-color:#d3adf7">赠送抽奖次数</button><button class="btn danger">删除</button></div></td>';
              tbody.appendChild(tr);
              const openGift=()=>{try{localStorage.setItem('festival_random_draw_template_mode','gift')}catch(e){};if(mainDoc.defaultView&&typeof mainDoc.defaultView.openEditor==='function')mainDoc.defaultView.openEditor(true)};
              tr.querySelector('.gift-edit-link').onclick=openGift;tr.querySelector('.gift-edit-btn').onclick=openGift;
            }
            const typeSelect=[...mainDoc.querySelectorAll('#list select')].find(s=>s.previousSibling&&String(s.previousSibling.textContent||'').includes('活动类型'))||mainDoc.querySelector('#list .select');
            if(typeSelect && ![...typeSelect.options].some(o=>o.text==='礼盒抽奖')){const o=mainDoc.createElement('option');o.text='礼盒抽奖';typeSelect.appendChild(o)}
          }catch(e){console.error(e)}
        };
        ensureGiftActivity();
        if(!mainDoc.body.dataset.giftActivityObserver){mainDoc.body.dataset.giftActivityObserver='1';new MutationObserver(()=>setTimeout(ensureGiftActivity,0)).observe(mainDoc.body,{childList:true,subtree:true})}
        if(!mainDoc.getElementById('manualGiftScript')){const mg=mainDoc.createElement('script');mg.id='manualGiftScript';mg.src='manual-gift.js?t='+Date.now();mainDoc.body.appendChild(mg)}
        const editorFrame=mainDoc.getElementById('editorFrame');
        if(!editorFrame) return;
        const enhanceEditor=()=>{
          try{
            const ed=editorFrame.contentDocument;
            if(!ed||!ed.body) return;
            const scripts=[
              ['allChanceMethodsScript','all-chance-methods.js'],['prizeConfigScript','prize-config.js'],['prizeUiPatchScript','prize-ui-patch.js'],['editorLayoutPatchScript','editor-layout-patch.js'],['winnerDisplayScript','display-winner-list.js'],['templateModeScript','template-mode.js']
            ];
            scripts.forEach(([id,src])=>{if(!ed.getElementById(id)){const s=ed.createElement('script');s.id=id;s.src=src+'?t='+Date.now();ed.body.appendChild(s)}});
            const applyVenueDropdown=()=>{
              const labels=[...ed.querySelectorAll('.field>label,.cc-field>label')];
              const label=labels.find(x=>x.textContent.replace('*','').trim()==='投注范围');
              if(!label) return;
              const field=label.parentElement;if(field.querySelector('select[data-venue-scope="1"]')) return;
              const radios=[...field.querySelectorAll('input[type="radio"]')];let selected='all';radios.forEach(r=>{if(r.checked&&/指定/.test(r.parentElement?.textContent||'')) selected='specified'});
              [...field.children].slice(1).forEach(x=>x.remove());
              const sel=ed.createElement('select');sel.className=field.classList.contains('cc-field')?'cc-select':'select';sel.dataset.venueScope='1';sel.innerHTML='<option value="all">全部场馆</option><option value="specified">指定场馆</option>';sel.value=selected;
              const venues=ed.createElement('div');venues.className=field.classList.contains('cc-field')?'cc-subbox':'venue-row';venues.style.display=selected==='specified'?'block':'none';venues.innerHTML='<div style="margin:12px 0 8px;font-weight:600">指定场馆（可多选）</div><div style="display:flex;gap:20px;flex-wrap:wrap"><label class="check"><input type="checkbox">体育</label><label class="check"><input type="checkbox">电子</label><label class="check"><input type="checkbox">电竞</label><label class="check"><input type="checkbox">彩票</label><label class="check"><input type="checkbox">捕鱼</label><label class="check"><input type="checkbox">真人</label></div>';
              sel.onchange=()=>venues.style.display=sel.value==='specified'?'block':'none';field.appendChild(sel);field.appendChild(venues);
            };
            const scrubManual=()=>{[...ed.querySelectorAll('.method')].filter(x=>x.querySelector('.method-top b')?.textContent.trim()==='后台赠送').forEach(x=>x.remove());const modal=ed.getElementById('methodModal');if(modal){[...modal.querySelectorAll('.method-choice')].filter(x=>x.textContent.trim()==='后台赠送').forEach(x=>x.remove())}};
            const patch=()=>{applyVenueDropdown();scrubManual()};patch();
            if(!ed.body.dataset.liveFixObserver){ed.body.dataset.liveFixObserver='1';new MutationObserver(()=>setTimeout(patch,0)).observe(ed.body,{childList:true,subtree:true})}
          }catch(e){console.error(e)}
        };
        editorFrame.addEventListener('load',()=>setTimeout(enhanceEditor,80));
        setInterval(()=>{try{if(editorFrame.contentDocument&&editorFrame.contentDocument.body&&editorFrame.src!=='about:blank') enhanceEditor()}catch(e){}},500);
      }catch(e){console.error(e)}
    };
    mainFrame.addEventListener('load',()=>setTimeout(installIntoMain,50));
    setTimeout(installIntoMain,100);
  }catch(e){console.error(e)}
};
</script></body></html>
