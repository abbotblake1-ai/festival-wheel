<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大转盘活动编辑</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.title{font-size:26px;font-weight:700}.sub{color:#667085;margin-top:10px}.btn{height:38px;padding:0 16px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:26px 0}.tab{height:48px;background:#eaecf0;display:flex;align-items:center;justify-content:center;color:#667085;cursor:pointer}.tab.on{background:#2f66e8;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:10px}.card-h{padding:18px 22px;border-bottom:1px solid #eaecf0;font-size:17px;font-weight:700}.card-b{padding:28px 36px}.form-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}.field label{display:block;font-weight:600;margin-bottom:9px}.req{color:#f04438;margin-right:5px}.input,.select,.textarea{width:100%;border:1px solid #d0d5dd;border-radius:7px;padding:0 12px;background:#fff}.input,.select{height:42px}.textarea{height:96px;padding-top:11px;resize:vertical}.range{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{max-width:1380px;margin:0 auto 20px;padding:13px 15px;background:#f8faff;border:1px solid #dbe7ff;border-radius:8px;color:#475467}.method-cards{max-width:1380px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.method{border:1px solid #d0d5dd;border-radius:9px;padding:16px;background:#fff}.method.on{border-color:#84adff;background:#f8faff}.method-top{display:flex;justify-content:space-between;align-items:center}.switch{width:42px;height:23px;border-radius:99px;background:#2563eb;position:relative}.switch:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;right:2px;top:2px}.subtabs{max-width:1380px;margin:0 auto 18px;display:flex;border-bottom:1px solid #eaecf0}.subtab{padding:11px 24px;border-bottom:2px solid transparent;cursor:pointer}.subtab.on{color:#2563eb;border-color:#2563eb}.table-wrap{max-width:1380px;margin:0 auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eee;text-align:left}.table th{background:#fafafa;color:#667085}.small{width:130px}.toolbar{max-width:1380px;margin:14px auto;display:flex;justify-content:space-between;align-items:center}.danger{color:#d92d20}.vip{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 11px;border:1px solid #d0d5dd;border-radius:6px;cursor:pointer}.chip.on{background:#eef4ff;border-color:#84adff;color:#175cd3}.upload-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}.upload-item label{display:block;font-weight:600;margin-bottom:9px}.upload-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{height:105px;border:1px dashed #b8c5d6;background:#f7f8fa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#98a2b3;cursor:pointer}.upload.done{background:#ecfdf3;color:#027a48;border-color:#abefc6}.full{grid-column:1/-1}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}@media(max-width:1000px){.form-grid,.upload-grid,.method-cards{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><div><button class="btn" onclick="parent.postMessage('closeEditor','*')">← 返回</button> <span class="title" id="pageTitle">新增节日大转盘</span><div class="sub">节日大转盘 · 国庆节首期配置</div></div><div><button class="btn">保存草稿</button> <button class="btn primary">发布活动</button></div></div><div class="tabs" id="tabs"></div><div id="body"></div></div><script>const names=['基础信息','参与范围','获取抽奖机会','奖品配置','页面装修','活动规则','发布确认'];let active=0, chance='bet';const editing=new URLSearchParams(location.search).get('mode')==='edit';document.getElementById('pageTitle').textContent=editing?'编辑：国庆大转盘':'新增节日大转盘';const field=(label,html,req=false)=>`<div class="field"><label>${req?'<span class="req">*</span>':''}${label}</label>${html}</div>`;const input=(v='',ph='')=>`<input class="input" value="${v}" placeholder="${ph}">`;function renderTabs(){tabs.innerHTML=names.map((n,i)=>`<div class="tab ${i===active?'on':''}" onclick="active=${i};render()">${i+1}. ${n}</div>`).join('')}function basic(){return `<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="form-grid">${field('活动名称',input(editing?'国庆大转盘':'','请输入活动名称'),true)}${field('活动进行时间',`<div class="range"><input class="input" type="datetime-local" value="2026-10-01T00:00"><input class="input" type="datetime-local" value="2026-10-07T23:59"></div>`,true)}${field('活动上架时间',`<input class="input" type="datetime-local" value="2026-09-30T12:00">`,true)}${field('活动说明','<textarea class="textarea" placeholder="请输入活动说明"></textarea>')}</div></div></div>`}function scope(){return `<div class="card"><div class="card-h">参与范围</div><div class="card-b"><div class="form-grid">${field('参与会员',`<select class="select"><option>全部会员</option><option>指定会员</option></select>`,true)}${field('VIP等级',`<div class="vip">${Array.from({length:12},(_,i)=>`<span class="chip on" onclick="this.classList.toggle('on')">VIP${i}</span>`).join('')}</div>`,true)}${field('参与终端',`<select class="select"><option>全部终端</option><option>APP/H5</option><option>Web</option></select>`)}${field('参与地区',`<select class="select"><option>全部地区</option></select>`)}</div></div></div>`}function chanceRows(type){let rows=type==='bet'?[[100,1],[500,5],[1000,12]]:[[100,1],[500,6],[1000,15]];return `<table class="table"><thead><tr><th>档位</th><th>${type==='bet'?'有效投注金额':'累计充值金额'}</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><input class="input small" value="${r[0]}"></td><td><input class="input small" value="${r[1]}"> 次</td><td><button class="btn danger">删除</button></td></tr>`).join('')}</tbody></table>`}function chancePanel(){if(chance==='login')return `<div class="form-grid">${field('登录计算方式',`<select class="select"><option>连续登录</option><option>累计登录</option></select>`,true)}${field('活动期间最多赠送',input('11'),true)}</div><div class="toolbar"><span>按登录天数配置节点</span><button class="btn primary">＋ 新增登录节点</button></div><div class="table-wrap"><table class="table"><thead><tr><th>节点</th><th>登录天数</th><th>赠送次数</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td><input class="input small" value="1"></td><td><input class="input small" value="1"></td><td><button class="btn danger">删除</button></td></tr></tbody></table></div>`;return `<div class="form-grid">${field('统计口径',`<select class="select"><option>活动期间累计${chance==='bet'?'有效投注':'充值'}</option><option>每日累计</option></select>`,true)}${field(chance==='bet'?'投注范围':'充值范围',`<select class="select"><option>全部${chance==='bet'?'场馆':'充值渠道'}</option><option>指定${chance==='bet'?'场馆':'充值渠道'}</option></select>`,true)}${field('每日赠送次数上限',input('200'),true)}${field('说明',input('', '达到多个档位时按配置分别赠送'))}</div><div class="toolbar"><span></span><button class="btn primary">＋ 新增档位</button></div><div class="table-wrap">${chanceRows(chance)}</div>`}function chancePage(){return `<div class="card"><div class="card-h">获取抽奖机会</div><div class="card-b"><div class="notice">投注赠送、充值赠送、每日登录可独立配置；启用后前端展示对应Tab。</div><div class="method-cards"><div class="method on"><div class="method-top"><b>投注赠送</b><div class="switch"></div></div></div><div class="method on"><div class="method-top"><b>充值赠送</b><div class="switch"></div></div></div><div class="method on"><div class="method-top"><b>每日登录</b><div class="switch"></div></div></div></div><div class="subtabs"><div class="subtab ${chance==='bet'?'on':''}" onclick="chance='bet';render()">投注赠送</div><div class="subtab ${chance==='recharge'?'on':''}" onclick="chance='recharge';render()">充值赠送</div><div class="subtab ${chance==='login'?'on':''}" onclick="chance='login';render()">每日登录</div></div>${chancePanel()}</div></div>`}function prize(){return `<div class="card"><div class="card-h">奖品配置</div><div class="card-b"><div class="notice">从公共奖品库选择奖品，再配置本活动库存、概率、VIP范围、有效期及流水规则。</div><div class="toolbar"><span></span><button class="btn primary">＋ 从奖品库添加</button></div><div class="table-wrap"><table class="table"><thead><tr><th>排序</th><th>奖品名称</th><th>类型</th><th>本活动奖励规则</th><th>适用VIP</th><th>库存</th><th>概率</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>88元现金券</td><td>现金券</td><td>奖励18元；有效期7天；1倍流水</td><td>VIP0-VIP11</td><td>100</td><td>1%</td><td><button class="btn">编辑</button></td></tr></tbody></table></div></div></div>`}const assets=['活动内页顶部图','活动背景图','幸运大转盘底座','大转盘外圈','大转盘','指针','大转盘背景图','获得抽奖机会背景图','我的抽奖机会','奖品展示'];function decor(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="upload-grid">${assets.map(a=>`<div class="upload-item"><label><span class="req">*</span>${a}</label><div class="upload-pair"><div class="upload" onclick="this.classList.add('done');this.textContent='✓ 已上传 APP/H5'">＋ 上传 APP/H5</div><div class="upload" onclick="this.classList.add('done');this.textContent='✓ 已上传 Web'">＋ 上传 Web</div></div></div>`).join('')}</div></div></div>`}function rules(){return `<div class="card"><div class="card-h">活动规则</div><div class="card-b"><div class="form-grid">${field('活动说明',`<textarea class="textarea" placeholder="请输入活动说明"></textarea>`,true)}${field('活动规则',`<textarea class="textarea" placeholder="请输入活动规则"></textarea>`,true)}${field('温馨提示',`<textarea class="textarea" placeholder="请输入温馨提示"></textarea>`)}${field('排序说明',input('数字越小越靠前'))}</div></div></div>`}function publish(){return `<div class="card"><div class="card-h">发布确认</div><div class="card-b"><div class="form-grid">${field('活动名称',input('国庆大转盘'))}${field('活动时间',input('2026/10/01 00:00 ~ 2026/10/07 23:59'))}${field('获取抽奖机会',input('投注赠送、充值赠送、每日登录'))}${field('奖品数量',input('3 个'))}</div><div class="footer"><button class="btn">保存草稿</button><button class="btn primary">确认发布</button></div></div></div>`}function render(){renderTabs();body.innerHTML=[basic,scope,chancePage,prize,decor,rules,publish][active]()}render();</script></body></html>
