<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="app" src="app-v2.html?v=202608110620"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,w=f.contentWindow;const css=d.createElement('style');css.textContent=`#stepBody .card-b{max-width:1540px;margin:0 auto;padding-left:42px!important;padding-right:42px!important}#stepBody .form-grid-unified{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:44px;row-gap:24px;max-width:1380px;margin:0 auto}#stepBody .form-grid-unified .field{margin:0!important;min-width:0}#stepBody .form-grid-unified label{display:block;margin-bottom:9px;font-weight:600}#stepBody .form-grid-unified .input,#stepBody .form-grid-unified .select,#stepBody .form-grid-unified .textarea{width:100%!important}#stepBody .form-grid-unified .textarea{min-height:92px}#stepBody .req-star{color:#f04438;margin-right:5px;font-weight:700}#stepBody .config-bar,#stepBody .login-config{grid-template-columns:1fr 1fr!important;gap:24px 44px!important;max-width:1380px;margin-left:auto!important;margin-right:auto!important}#stepBody .chance-methods,#stepBody .chance-tabs,#stepBody .chance-actions,#stepBody .chance-table,#stepBody .venue-box,#stepBody .notice,#stepBody .preview-note{max-width:1380px;margin-left:auto!important;margin-right:auto!important}#stepBody .asset-section{max-width:1380px;margin-left:auto;margin-right:auto;grid-template-columns:170px 1fr}#stepBody .subhead{max-width:1380px;margin-left:auto!important;margin-right:auto!important}@media(max-width:1000px){#stepBody .form-grid-unified,#stepBody .config-bar,#stepBody .login-config{grid-template-columns:1fr!important}#stepBody .card-b{padding-left:18px!important;padding-right:18px!important}}`;d.head.appendChild(css);function starLabels(root=d){root.querySelectorAll('label,.asset-label,.mini-label').forEach(el=>{if(el.dataset.starDone)return;let t=el.textContent.trim();if(t.endsWith('*')){el.innerHTML='<span class="req-star">*</span>'+t.slice(0,-1).trim();el.dataset.starDone='1'}})}function basic(){const a=d.querySelector('.step.on'),b=d.getElementById('stepBody');if(!a||!b||!a.textContent.includes('基础信息'))return;b.innerHTML=`<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="form-grid-unified"><div class="field"><label><span class="req-star">*</span>活动名称</label><input class="input" placeholder="请输入活动名称"></div><div class="field"><label><span class="req-star">*</span>活动进行时间</label><div class="grid2"><input class="input" type="datetime-local" value="2026-10-01T00:00"><input class="input" type="datetime-local" value="2026-10-07T23:59"></div></div><div class="field"><label><span class="req-star">*</span>活动上架时间</label><input class="input" type="datetime-local" value="2026-09-30T12:00"></div><div class="field"><label>活动说明</label><textarea class="textarea" placeholder="请输入活动说明"></textarea></div></div></div></div>`}function normalize(){basic();starLabels();const b=d.getElementById('stepBody');if(!b)return;b.querySelectorAll('.card-b').forEach(cb=>{const direct=[...cb.children].filter(x=>x.classList&&x.classList.contains('field'));if(direct.length>1&&!cb.querySelector('.form-grid-unified')){const g=d.createElement('div');g.className='form-grid-unified';direct[0].before(g);direct.forEach(x=>g.appendChild(x))}})}d.addEventListener('click',()=>setTimeout(normalize,20),true);new MutationObserver(()=>setTimeout(normalize,20)).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});normalize();if(location.search.includes('mode=edit')&&typeof w.openEditor==='function')w.openEditor(true);if(location.search.includes('mode=new')&&typeof w.openEditor==='function')w.openEditor(false);w.showActivities=()=>parent.postMessage('closeEditor','*')};</script></body></html>
