<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="app" src="app-v2.html?v=202608110700"></iframe><script>const outer=document.getElementById('app');outer.onload=()=>{const midDoc=outer.contentDocument;const inner=midDoc.getElementById('app');if(!inner)return;function apply(){const d=inner.contentDocument,w=inner.contentWindow;if(!d||!d.body)return;const css=d.createElement('style');css.id='layout-unified-v3';css.textContent=`#stepBody .card-b{max-width:1500px;margin:0 auto;padding:28px 54px!important}#stepBody .form-grid-unified{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:48px!important;row-gap:24px!important;max-width:1360px;margin:0 auto}#stepBody .form-grid-unified>.field{margin:0!important;min-width:0}#stepBody .form-grid-unified label{display:block;margin-bottom:9px;font-weight:600}#stepBody .form-grid-unified .input,#stepBody .form-grid-unified .select,#stepBody .form-grid-unified .textarea{width:100%!important;max-width:none!important}#stepBody .form-grid-unified .grid2{display:grid!important;grid-template-columns:1fr 1fr!important;gap:14px!important}#stepBody .req-star{color:#f04438!important;margin-right:5px!important;font-weight:700}#stepBody .config-bar,#stepBody .login-config{grid-template-columns:1fr 1fr!important;gap:22px 48px!important;max-width:1360px!important;margin-left:auto!important;margin-right:auto!important}#stepBody .chance-methods,#stepBody .chance-tabs,#stepBody .chance-actions,#stepBody .chance-table,#stepBody .venue-box,#stepBody .notice,#stepBody .preview-note,#stepBody .asset-section,#stepBody .subhead{max-width:1360px!important;margin-left:auto!important;margin-right:auto!important}@media(max-width:1000px){#stepBody .form-grid-unified,#stepBody .config-bar,#stepBody .login-config{grid-template-columns:1fr!important}#stepBody .card-b{padding:20px!important}}`;if(!d.getElementById(css.id))d.head.appendChild(css);function moveStars(){d.querySelectorAll('label,.asset-label,.mini-label').forEach(el=>{if(el.dataset.starDone)return;const t=el.textContent.trim();if(t.endsWith('*')){el.innerHTML='<span class="req-star">*</span>'+t.slice(0,-1).trim();el.dataset.starDone='1'}})}function renderBasic(){const a=d.querySelector('.step.on'),b=d.getElementById('stepBody');if(!a||!b||!a.textContent.includes('基础信息'))return;if(b.dataset.basicV3)return;b.dataset.basicV3='1';b.innerHTML=`<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="form-grid-unified"><div class="field"><label><span class="req-star">*</span>活动名称</label><input class="input" value="${location.search.includes('mode=edit')?'国庆大转盘':''}" placeholder="请输入活动名称"></div><div class="field"><label><span class="req-star">*</span>活动进行时间</label><div class="grid2"><input class="input" type="datetime-local" value="2026-10-01T00:00"><input class="input" type="datetime-local" value="2026-10-07T23:59"></div></div><div class="field"><label><span class="req-star">*</span>活动上架时间</label><input class="input" type="datetime-local" value="2026-09-30T12:00"></div><div class="field"><label>活动说明</label><textarea class="textarea" placeholder="请输入活动说明"></textarea></div></div></div></div>`}function normalize(){renderBasic();moveStars();const b=d.getElementById('stepBody');if(!b)return;b.querySelectorAll('.card-b').forEach(cb=>{if(cb.querySelector('.form-grid-unified'))return;const direct=[...cb.children].filter(x=>x.classList&&x.classList.contains('field'));if(direct.length>1){const g=d.createElement('div');g.className='form-grid-unified';direct[0].before(g);direct.forEach(x=>g.appendChild(x))}})}d.addEventListener('click',()=>setTimeout(normalize,30),true);new MutationObserver(()=>setTimeout(normalize,30)).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});if(location.search.includes('mode=edit')&&typeof w.openEditor==='function')w.openEditor(true);if(location.search.includes('mode=new')&&typeof w.openEditor==='function')w.openEditor(false);w.showActivities=()=>parent.postMessage('closeEditor','*');setTimeout(normalize,60)}if(inner.contentDocument&&inner.contentDocument.readyState==='complete')apply();else inner.onload=apply};</script></body></html>
