<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%}</style></head><body><iframe id="app" src="app-v2.html?v=202608110500"></iframe><script>const f=document.getElementById('app');f.onload=()=>{const d=f.contentDocument,w=f.contentWindow;function patch(){const a=d.querySelector('.step.on'),b=d.getElementById('stepBody');if(!a||!b||!a.textContent.includes('基础信息'))return;b.innerHTML=`<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="field"><label>活动名称 *</label><input class="input" placeholder="请输入活动名称"></div><div class="field"><label>活动进行时间 *</label><div class="grid2"><input class="input" type="datetime-local" value="2026-10-01T00:00"><input class="input" type="datetime-local" value="2026-10-07T23:59"></div></div><div class="field"><label>活动上架时间 *</label><input class="input" type="datetime-local" value="2026-09-30T12:00"></div><div class="field"><label>活动说明</label><textarea class="textarea" placeholder="请输入活动说明"></textarea></div></div></div>`}d.addEventListener('click',()=>setTimeout(patch,0),true);new MutationObserver(()=>setTimeout(patch,0)).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});patch();if(location.search.includes('mode=edit')&&typeof w.openEditor==='function')w.openEditor(true);if(location.search.includes('mode=new')&&typeof w.openEditor==='function')w.openEditor(false);w.showActivities=()=>parent.postMessage('closeEditor','*')};</script></body></html>
