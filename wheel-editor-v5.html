<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大转盘活动编辑</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:26px;font-weight:700}.sub{color:#667085;margin-top:10px}.btn{height:38px;padding:0 16px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#d92d20}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:26px 0}.tab{height:48px;background:#eaecf0;display:flex;align-items:center;justify-content:center;color:#667085;cursor:pointer}.tab.on{background:#2f66e8;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:10px}.card-h{padding:18px 22px;border-bottom:1px solid #eaecf0;font-size:17px;font-weight:700}.card-b{padding:30px 42px}.form-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:26px 48px}.field{min-width:0}.field label{display:block;font-weight:600;margin-bottom:9px}.req{color:#f04438;margin-right:5px}.input,.select,.textarea,.picker-input{width:100%;border:1px solid #d0d5dd;border-radius:7px;background:#fff}.input,.select,.picker-input{height:44px;padding:0 12px}.textarea{height:98px;padding:11px 12px;resize:vertical}.picker-input{display:flex;align-items:center;justify-content:space-between;color:#98a2b3;cursor:pointer}.picker-input.filled{color:#172033}.check-row{display:flex;gap:28px;align-items:center;min-height:44px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:7px;cursor:pointer}.check input{width:16px;height:16px}.notice{max-width:1380px;margin:0 auto 20px;padding:13px 15px;background:#f8faff;border:1px solid #dbe7ff;border-radius:8px;color:#475467}.method-cards{max-width:1380px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.method{border:1px solid #84adff;background:#f8faff;border-radius:9px;padding:16px}.method-top{display:flex;justify-content:space-between;align-items:center}.method-desc{font-size:13px;color:#667085;margin-top:8px}.switch{width:42px;height:23px;border-radius:99px;background:#2563eb;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;right:2px;top:2px}.switch.off{background:#d0d5dd}.switch.off:after{right:21px}.chance-tabs{max-width:1380px;margin:0 auto;border-bottom:1px solid #eaecf0;display:flex;gap:8px}.chance-tab{padding:13px 22px;color:#667085;cursor:pointer;border-bottom:2px solid transparent}.chance-tab.on{color:#2563eb;border-color:#2563eb;font-weight:600}.chance-config{max-width:1380px;margin:18px auto 0}.chance-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;background:#f8f9fb;border:1px solid #eaecf0;border-radius:9px;padding:18px}.chance-note{margin:18px 0 8px;color:#667085}.toolbar{margin:14px 0;display:flex;justify-content:space-between;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eee;text-align:left}.table th{background:#fafafa;color:#667085}.small{width:130px}.upload-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}.upload-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{height:105px;border:1px dashed #b8c5d6;background:#f7f8fa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#98a2b3;cursor:pointer}.section{max-width:1380px;margin:0 auto 26px;border:1px solid #b8d3ff;border-radius:14px;padding:24px;background:#fff}.section-title{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700;border-bottom:1px solid #edf1f7;padding-bottom:16px}.section-toolbar{display:flex;align-items:center;gap:14px;margin:20px 0 16px}.tip{color:#f04438;font-weight:600}.empty{text-align:center;color:#98a2b3;padding:42px}.badge{font-size:13px;color:#2563eb;border:1px solid #b8d3ff;border-radius:20px;padding:5px 12px}.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:80}.modal-box{width:min(900px,88vw);background:#fff;border-radius:12px;overflow:hidden}.modal-h{padding:22px 28px;border-bottom:1px solid #eaecf0;font-size:24px;font-weight:700;display:flex;justify-content:space-between}.modal-b{padding:28px}.radio-row{display:flex;gap:28px;margin:12px 0 24px}.radio-row label{display:flex;gap:8px;align-items:center;font-size:18px}.upload2{display:grid;grid-template-columns:1fr 1fr;gap:28px}.upbox{height:150px;border:1px dashed #b8c5d6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#98a2b3;cursor:pointer}.hint{color:#667085;margin-top:8px}.modal-f{padding:18px 28px;border-top:1px solid #eaecf0;display:flex;justify-content:flex-end;gap:12px}.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:50;display:none}.picker{position:absolute;top:105px;left:50%;transform:translateX(-50%);width:min(1160px,92vw);background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 20px 45px rgba(16,24,40,.16);display:grid;grid-template-columns:180px 1fr}.shortcuts{border-right:1px solid #eaecf0;padding:14px 0}.shortcut{padding:14px 24px;cursor:pointer}.picker-main{padding:18px 22px}.picker-top{display:grid;grid-template-columns:1fr 160px 28px 1fr 160px;gap:12px;align-items:center;margin-bottom:18px}.picker-top.single{grid-template-columns:1fr 160px}.pick-input{height:42px;border:1px solid #d0d5dd;border-radius:6px;padding:0 12px}.months{display:grid;grid-template-columns:1fr 1fr;gap:30px}.months.single{grid-template-columns:1fr}.month-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-bottom:14px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week div{padding:8px;color:#98a2b3}.day{padding:10px 0;border-radius:5px;cursor:pointer}.day.muted{color:#d0d5dd}.day.sel{background:#2563eb;color:#fff}.picker-foot{border-top:1px solid #eaecf0;margin-top:18px;padding-top:16px;display:flex;justify-content:flex-end;gap:12px}.linkbtn{border:0;background:none;color:#1677ff;font-size:16px;cursor:pointer}.confirm{height:38px;border:1px solid #1677ff;background:#fff;color:#1677ff;border-radius:6px;padding:0 18px;cursor:pointer}@media(max-width:1000px){.form-grid,.upload-grid,.method-cards,.chance-top,.upload2{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.picker{grid-template-columns:1fr}.shortcuts{display:none}.months{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><button class="btn" onclick="parent.postMessage('closeEditor','*')">← 返回</button> <span class="title" id="pageTitle"></span><div class="sub">节日大转盘 · 国庆节首期配置</div></div><div><button class="btn">保存草稿</button> <button class="btn primary">发布活动</button></div></div><div class="tabs" id="tabs"></div><div id="body"></div></div><div class="modal" id="contentModal"><div class="modal-box"><div class="modal-h"><span id="modalTitle">新增活动内容</span><span style="cursor:pointer" onclick="closeContentModal()">×</span></div><div class="modal-b"><label><span class="req">*</span>上传类型</label><div class="radio-row"><label><input type="radio" name="uploadType" value="text" checked onchange="switchUploadType()">文本</label><label><input type="radio" name="uploadType" value="image" onchange="switchUploadType()">图片上传</label></div><div id="textAreaWrap"><label><span class="req">*</span>文本</label><input id="modalText" class="input" placeholder="请输入"></div><div id="imageAreaWrap" style="display:none"><div class="upload2"><div><label><span class="req">*</span>APP/H5图片</label><div id="appUp" class="upbox" onclick="this.textContent='✓';this.dataset.done='1'">＋</div><div class="hint">jpg、png，单张不超过1MB，每次1张</div></div><div><label><span class="req">*</span>Web图片</label><div id="webUp" class="upbox" onclick="this.textContent='✓';this.dataset.done='1'">＋</div><div class="hint">规则与APP/H5一致</div></div></div></div><div class="hint" style="margin-top:22px">两种方式互斥：选择文本不支持图片，选择图片上传不支持文字</div></div><div class="modal-f"><button class="btn primary" onclick="saveContentItem()">确认</button><button class="btn" onclick="closeContentModal()">关闭</button></div></div></div><div class="picker-overlay" id="pickerOverlay" onclick="if(event.target===this)pickerOverlay.style.display='none'"><div class="picker"><div class="shortcuts" id="shortcuts"></div><div class="picker-main"><div class="picker-top" id="pickerTop"></div><div class="months" id="months"></div><div class="picker-foot"><button class="linkbtn" onclick="clearPicker()">清空</button><button class="confirm" onclick="confirmPicker()">确定</button></div></div></div></div><script>const names=['基础信息','参与范围','获取抽奖机会','奖品配置','页面装修','活动规则','发布确认'];let active=0,chanceTab='bet',contentType='content',contentItems=[],ruleItems=[],editIdx=null,pickerTarget='',pickerMode='range',startDate='',endDate='',singleDate='',startTime='00:00:00',endTime='23:59:59',singleTime='00:00:00';const editing=new URLSearchParams(location.search).get('mode')==='edit';pageTitle.textContent=editing?'编辑：国庆大转盘':'新增节日大转盘';const field=(label,html,req=false)=>`<div class="field"><label>${req?'<span class="req">*</span>':''}${label}</label>${html}</div>`;function renderTabs(){tabs.innerHTML=names.map((n,i)=>`<div class="tab ${active===i?'on':''}" onclick="active=${i};render()">${i+1}. ${n}</div>`).join('')}function pickerBox(id,ph){return `<div id="${id}" class="picker-input" onclick="openPicker('${id}')"><span>${ph}</span><span>▣</span></div>`}function basic(){return `<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="form-grid">${field('活动名称',`<input class="input" value="${editing?'国庆大转盘':''}" placeholder="请输入活动名称">`,true)}${field('活动进行时间',pickerBox('activityRange','开始时间 － 结束时间'),true)}${field('活动上架时间',pickerBox('publishTime','请选择时间'),true)}${field('活动说明','<textarea class="textarea" placeholder="请输入活动说明"></textarea>')}</div></div></div>`}function scope(){return `<div class="card"><div class="card-h">参与范围</div><div class="card-b"><div class="form-grid">${field('参与会员','<select class="select"><option>全部会员</option><option>指定会员</option></select>',true)}${field('VIP等级','<div class="check-row">'+Array.from({length:12},(_,i)=>`<label class="check"><input type="checkbox" checked>VIP${i}</label>`).join('')+'</div>',true)}${field('参与终端','<div class="check-row"><label class="check"><input type="checkbox" id="allTerminal" checked onchange="toggleAllTerminals(this)">全部</label><label class="check"><input type="checkbox" class="terminal" checked onchange="syncTerminalAll()">PC</label><label class="check"><input type="checkbox" class="terminal" checked onchange="syncTerminalAll()">H5</label><label class="check"><input type="checkbox" class="terminal" checked onchange="syncTerminalAll()">APP</label></div>',true)}</div></div></div>`}function toggleAllTerminals(el){document.querySelectorAll('.terminal').forEach(x=>x.checked=el.checked)}function syncTerminalAll(){const xs=[...document.querySelectorAll('.terminal')],a=document.getElementById('allTerminal');if(a)a.checked=xs.every(x=>x.checked)}let tiers={bet:[[100,1],[500,5],[1000,12]],recharge:[[100,1],[500,6],[1000,15]],login:[[1,1],[3,2],[5,3]]};function chance(){const rows=tiers[chanceTab],title=chanceTab==='bet'?'有效投注金额（元）':chanceTab==='recharge'?'累计充值金额（元）':'登录天数';return `<div class="card"><div class="card-h">获取抽奖机会</div><div class="card-b"><div class="notice"><b>配置说明：</b> 投注赠送、充值赠送、每日登录可独立开启/关闭；开启后前端展示对应Tab。</div><div class="method-cards"><div class="method"><div class="method-top"><b>投注赠送</b><div class="switch"></div></div><div class="method-desc">会员达到指定有效投注金额后，获得对应抽奖次数。</div></div><div class="method"><div class="method-top"><b>充值赠送</b><div class="switch"></div></div><div class="method-desc">会员达到指定充值金额后，获得对应抽奖次数。</div></div><div class="method"><div class="method-top"><b>每日登录</b><div class="switch"></div></div><div class="method-desc">达到登录节点后获得抽奖次数。</div></div></div><div class="chance-tabs"><div class="chance-tab ${chanceTab==='bet'?'on':''}" onclick="chanceTab='bet';render()">投注赠送</div><div class="chance-tab ${chanceTab==='recharge'?'on':''}" onclick="chanceTab='recharge';render()">充值赠送</div><div class="chance-tab ${chanceTab==='login'?'on':''}" onclick="chanceTab='login';render()">每日登录</div></div><div class="chance-config"><div class="chance-top"><div class="field"><label><span class="req">*</span>统计口径</label><select class="select"><option>活动期间累计${chanceTab==='bet'?'有效投注':chanceTab==='recharge'?'充值':'登录'}</option><option>每日累计</option></select></div><div class="field"><label><span class="req">*</span>${chanceTab==='bet'?'投注范围':chanceTab==='recharge'?'充值范围':'登录范围'}</label><select class="select"><option>${chanceTab==='bet'?'全部场馆':chanceTab==='recharge'?'全部渠道':'全部会员'}</option></select></div><div class="field"><label><span class="req">*</span>每日赠送次数上限</label><input class="input" value="200"></div></div><div class="chance-note">达到多个档位时，各档位按配置分别赠送对应抽奖次数。</div><div class="toolbar"><span></span><button class="btn primary" onclick="addTier()">＋ 新增档位</button></div><table class="table"><thead><tr><th>档位</th><th>${title}</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><input class="input small" value="${r[0]??''}"></td><td><input class="input small" value="${r[1]??''}"> 次</td><td><button class="btn danger" onclick="delTier(${i})">删除</button></td></tr>`).join('')}</tbody></table></div></div></div>`}function addTier(){tiers[chanceTab].push(['','']);render()}function delTier(i){tiers[chanceTab].splice(i,1);render()}function prize(){return `<div class="card"><div class="card-h">奖品配置</div><div class="card-b"><div class="notice">从公共奖品库选择奖品，再配置本活动库存、概率、VIP范围、有效期及流水规则。</div><div class="toolbar"><span></span><button class="btn primary">＋ 从奖品库添加</button></div><table class="table"><thead><tr><th>排序</th><th>奖品名称</th><th>类型</th><th>适用VIP</th><th>库存</th><th>概率</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>88元现金券</td><td>现金券</td><td>VIP0-VIP11</td><td>100</td><td>1%</td><td><button class="btn">编辑</button></td></tr></tbody></table></div></div>`}const assets=['活动内页顶部图','活动背景图','幸运大转盘底座','大转盘外圈','大转盘','指针','大转盘背景图','获得抽奖机会背景图','我的抽奖机会','奖品展示'];function decor(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="upload-grid">${assets.map(a=>`<div class="field"><label><span class="req">*</span>${a}</label><div class="upload-pair"><div class="upload">＋ 上传 APP/H5</div><div class="upload">＋ 上传 Web</div></div></div>`).join('')}</div></div></div>`}function rules(){return `<div><div class="section"><div class="section-title"><span>④ 活动内容</span><span class="badge">本期新增需求</span></div><div class="section-toolbar"><button class="btn primary" onclick="openContentModal('content')">＋ 新增</button><span class="tip">注：活动内容由序号1+序号1图片+序号2+序号2图片+……拼接而成</span></div>${listTable('content')}</div><div class="section"><div class="section-title"><span>⑤ 活动规则</span><span class="badge">本期新增需求</span></div><div class="section-toolbar"><button class="btn primary" onclick="openContentModal('rule')">＋ 新增</button><span class="tip">注：活动规则由序号1+序号1图片+序号2+序号2图片+……拼接而成</span></div>${listTable('rule')}</div></div>`}function listTable(type){const arr=type==='content'?contentItems:ruleItems;return `<table class="table"><thead><tr><th style="width:120px">序号</th><th>${type==='content'?'内容':'规则内容'}</th><th>APP/H5图片</th><th>Web图片</th><th style="width:180px">操作</th></tr></thead><tbody>${arr.length?arr.map((x,i)=>`<tr><td>${i+1}</td><td>${x.kind==='text'?x.text:'图片上传'}</td><td>${x.kind==='image'?'已上传':'-'}</td><td>${x.kind==='image'?'已上传':'-'}</td><td><button class="btn" onclick="editItem('${type}',${i})">编辑</button> <button class="btn danger" onclick="deleteItem('${type}',${i})">删除</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">暂无数据，点击「＋新增」添加（支持文本 / 图片）</td></tr>`}</tbody></table>`}function openContentModal(type){contentType=type;editIdx=null;modalTitle.textContent=type==='content'?'新增活动内容':'新增活动规则';document.querySelector('input[name=uploadType][value=text]').checked=true;modalText.value='';appUp.textContent='＋';webUp.textContent='＋';appUp.dataset.done='';webUp.dataset.done='';switchUploadType();contentModal.style.display='flex'}function closeContentModal(){contentModal.style.display='none'}function switchUploadType(){const v=document.querySelector('input[name=uploadType]:checked').value;textAreaWrap.style.display=v==='text'?'block':'none';imageAreaWrap.style.display=v==='image'?'block':'none'}function saveContentItem(){const kind=document.querySelector('input[name=uploadType]:checked').value;if(kind==='text'&&!modalText.value.trim())return alert('请输入文本');if(kind==='image'&&(!appUp.dataset.done||!webUp.dataset.done))return alert('请上传APP/H5图片和Web图片');const obj={kind,text:modalText.value.trim()};const arr=contentType==='content'?contentItems:ruleItems;if(editIdx===null)arr.push(obj);else arr[editIdx]=obj;closeContentModal();render()}function editItem(type,i){contentType=type;editIdx=i;const x=(type==='content'?contentItems:ruleItems)[i];modalTitle.textContent=type==='content'?'编辑活动内容':'编辑活动规则';document.querySelector(`input[name=uploadType][value=${x.kind}]`).checked=true;modalText.value=x.text||'';appUp.textContent=x.kind==='image'?'✓':'＋';webUp.textContent=x.kind==='image'?'✓':'＋';appUp.dataset.done=x.kind==='image'?'1':'';webUp.dataset.done=x.kind==='image'?'1':'';switchUploadType();contentModal.style.display='flex'}function deleteItem(type,i){(type==='content'?contentItems:ruleItems).splice(i,1);render()}function publish(){return `<div class="card"><div class="card-h">发布确认</div><div class="card-b"><div class="form-grid">${field('活动名称','<input class="input" value="国庆大转盘">')}${field('活动时间','<input class="input" placeholder="未选择">')}${field('获取抽奖机会','<input class="input" value="投注赠送、充值赠送、每日登录">')}${field('奖品数量','<input class="input" value="3个">')}</div></div></div>`}function render(){renderTabs();body.innerHTML=[basic,scope,chance,prize,decor,rules,publish][active]();restorePickerText()}function openPicker(id){pickerTarget=id;pickerMode=id==='activityRange'?'range':'single';shortcuts.innerHTML=['今天','昨天','最近7天','最近15天','本周','上周','本月','上月'].map(x=>`<div class="shortcut" onclick="quick('${x}')">${x}</div>`).join('');renderPicker();pickerOverlay.style.display='block'}function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function quick(k){const t=new Date();let s=new Date(t),e=new Date(t);if(k==='昨天'){s.setDate(s.getDate()-1);e=new Date(s)}if(k==='最近7天')s.setDate(s.getDate()-6);if(k==='最近15天')s.setDate(s.getDate()-14);if(pickerMode==='single')singleDate=fmt(s);else{startDate=fmt(s);endDate=fmt(e)}renderPicker()}function renderPicker(){pickerTop.className='picker-top'+(pickerMode==='single'?' single':'');pickerTop.innerHTML=pickerMode==='range'?`<input class="pick-input" value="${startDate}" placeholder="开始日期"><input class="pick-input" value="${startTime}"><span>›</span><input class="pick-input" value="${endDate}" placeholder="结束日期"><input class="pick-input" value="${endTime}">`:`<input class="pick-input" value="${singleDate}" placeholder="选择日期"><input class="pick-input" value="${singleTime}">`;months.className='months'+(pickerMode==='single'?' single':'');months.innerHTML=calendarHTML(new Date().getFullYear(),new Date().getMonth())+(pickerMode==='range'?calendarHTML(new Date().getFullYear(),new Date().getMonth()+1):'')}function calendarHTML(y,m){const d=new Date(y,m,1),yy=d.getFullYear(),mm=d.getMonth(),days=new Date(yy,mm+1,0).getDate(),offset=d.getDay();let cells='';for(let i=0;i<offset;i++)cells+='<div class="day muted"></div>';for(let i=1;i<=days;i++){const val=`${yy}-${String(mm+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;cells+=`<div class="day" onclick="pickDay('${val}')">${i}</div>`}return `<div><div class="month-head"><span>‹</span><span>${yy}年 ${mm+1}月</span><span>›</span></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="days">${cells}</div></div>`}function pickDay(v){if(pickerMode==='single')singleDate=v;else if(!startDate||endDate){startDate=v;endDate=''}else endDate=v;renderPicker()}function clearPicker(){if(pickerMode==='single')singleDate='';else{startDate='';endDate=''}pickerOverlay.style.display='none';render()}function confirmPicker(){if(pickerMode==='range'&&(!startDate||!endDate))return alert('请选择开始和结束日期');if(pickerMode==='single'&&!singleDate)return alert('请选择日期');pickerOverlay.style.display='none';render()}function restorePickerText(){const a=document.getElementById('activityRange'),p=document.getElementById('publishTime');if(a&&startDate&&endDate){a.classList.add('filled');a.firstElementChild.textContent=`${startDate} ${startTime} － ${endDate} ${endTime}`}if(p&&singleDate){p.classList.add('filled');p.firstElementChild.textContent=`${singleDate} ${singleTime}`}}render();</script></body></html>
