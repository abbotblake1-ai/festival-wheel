<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节日大转盘前端原型</title><style>*{box-sizing:border-box}html,body{margin:0;background:#220506;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff}.toolbar{position:sticky;top:0;z-index:99;height:54px;background:#101216;display:flex;align-items:center;justify-content:center;gap:8px}.toolbar button{border:1px solid #444b59;background:#1b1f27;color:#cfd5df;padding:9px 18px;border-radius:7px;cursor:pointer}.toolbar button.on{background:#2563eb;color:#fff}.viewport{margin:0 auto;background:#640d0b;overflow:hidden;min-height:100vh;transition:.25s}.viewport.pc{width:100%}.viewport.h5{width:min(390px,100vw);max-width:390px;margin:16px auto 30px;border-radius:20px;box-shadow:0 22px 70px #000}.hero{position:relative;width:100%;aspect-ratio:932/424;overflow:hidden;background:#8d0d08}.hero img{width:100%;height:100%;display:block;object-fit:cover}.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.page-bg{background:linear-gradient(#76110d,#4a0908 55%,#2f0707);padding:24px 0 70px}.container{width:min(1180px,92%);margin:auto}.card,.section{border:1px solid rgba(255,214,126,.28);background:linear-gradient(rgba(120,19,15,.98),rgba(75,8,8,.98));border-radius:18px;margin:18px auto;overflow:hidden}.card{padding:24px;text-align:center}.card h2,.title{color:#ffd979}.card h2{margin:0 0 10px}.card p{margin:0;color:#ffd7ac;line-height:1.8}.title{text-align:center;font-size:28px;font-weight:900;padding:22px 16px 10px}.sub{text-align:center;color:#dca995;font-size:13px}.wheel-area{min-height:500px;padding:16px}.wheel-stage{width:390px;height:390px;margin:auto;position:relative}.base{position:absolute;width:240px;height:64px;left:75px;bottom:-18px;background:linear-gradient(#f7be38,#9d1d09);border-radius:50% 50% 22% 22%}.outer{position:absolute;inset:12px;border-radius:50%;background:linear-gradient(145deg,#ffd65c,#c22911 38%,#ffce48 63%,#8b1006);display:flex;align-items:center;justify-content:center}.wheel{width:330px;height:330px;border-radius:50%;border:7px solid #761208;background:conic-gradient(#ffe29a 0 45deg,#f05a32 45deg 90deg,#ffe29a 90deg 135deg,#f05a32 135deg 180deg,#ffe29a 180deg 225deg,#f05a32 225deg 270deg,#ffe29a 270deg 315deg,#f05a32 315deg);transition:transform 3.8s cubic-bezier(.15,.74,.12,1);position:relative}.reward{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:11px;font-weight:800;color:#7a180b;width:82px;text-align:center}.reward span{display:block}.pointer{position:absolute;z-index:4;left:50%;top:34px;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:50px solid #9a1009}.spin{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;border:6px solid #ffd159;background:radial-gradient(circle at 35% 30%,#ffdd72,#da351b 45%,#9d1309);color:#fff6c9;font-weight:900;font-size:18px}.chance{text-align:center;color:#ffe3a0;font-weight:800}.tabs{display:flex;justify-content:center;gap:10px;padding:10px}.tabs button{border:1px solid #c64527;background:#6f120d;color:#ffd7a8;padding:10px 24px;border-radius:20px}.tabs button.on{background:#e65b27;color:#fff}.panel{display:none;padding:0 18px 20px}.panel.on{display:block}.row{display:grid;grid-template-columns:150px 100px 1fr 80px;gap:10px;align-items:center;padding:13px;border-bottom:1px solid rgba(255,255,255,.1)}.progress{height:10px;background:#3d0a08;border-radius:10px;overflow:hidden}.bar{height:100%;background:#ff8b28}.status{text-align:center;color:#ffc27d}.claim{background:#ff8b28;color:#fff;padding:6px;border-radius:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 22px}.stat{background:#540b09;border-radius:12px;text-align:center;padding:16px}.stat b{display:block;font-size:25px;color:#ffda76}.record-btn{display:block;margin:0 auto 15px;padding:9px 20px;border:1px solid #f2a44c;background:#7e160f;color:#ffd9a2;border-radius:20px}.marquee-box{border-top:1px solid rgba(255,255,255,.1);padding:13px;overflow:hidden;white-space:nowrap}.marquee{display:inline-block;animation:marq 18s linear infinite;color:#ffe7bf}@keyframes marq{from{transform:translateX(20%)}to{transform:translateX(-100%)}}.h5 .hero{height:520px;aspect-ratio:auto}.h5 .hero img{object-fit:cover;object-position:center}.h5 .page-bg{padding:10px 0 40px}.h5 .container{width:100%;padding:0 10px}.h5 .card,.h5 .section{margin:10px 0;border-radius:14px}.h5 .card{padding:14px 12px}.h5 .card h2{font-size:19px}.h5 .card p{font-size:12px}.h5 .title{font-size:20px;padding:16px 8px 6px}.h5 .sub{font-size:11px}.h5 .wheel-area{min-height:350px;padding:8px}.h5 .wheel-stage{width:280px;height:280px}.h5 .outer{inset:8px}.h5 .wheel{width:232px;height:232px}.h5 .base{width:174px;height:46px;left:53px;bottom:-14px}.h5 .pointer{top:26px;border-left-width:13px;border-right-width:13px;border-top-width:38px}.h5 .spin{width:74px;height:74px;border-width:4px;font-size:14px}.h5 .reward{font-size:8px;width:58px}.h5 .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px}.h5 .tabs button{padding:8px 2px;border-radius:8px;font-size:11px}.h5 .panel{padding:0 8px 12px}.h5 .row{grid-template-columns:70px 52px minmax(0,1fr) 52px;gap:4px;padding:9px 2px;font-size:10px}.h5 .stats{padding:8px;gap:5px}.h5 .stat{padding:10px 2px;font-size:10px}.h5 .stat b{font-size:19px}.h5 .marquee-box{font-size:11px;padding:10px 8px}</style></head><body><div class="toolbar"><button id="pcBtn" class="on" onclick="setMode('pc')">PC预览</button><button id="h5Btn" onclick="setMode('h5')">H5预览</button></div><div id="viewport" class="viewport pc"><section class="hero"><img src="assets/national-day-hero.svg" alt="国庆豪礼大转盘"><canvas id="fireworksCanvas"></canvas></section><main class="page-bg"><div class="container"><section class="card"><h2>活动内容</h2><p>活动期间完成投注、充值、每日登录任务，即可获得抽奖机会。<br>达到任务条件后请及时领取，抽奖机会当日有效。</p></section><section class="section"><div class="title">幸运大转盘</div><div class="sub">转盘区域</div><div class="wheel-area"><div class="wheel-stage"><div class="base"></div><div class="outer"><div id="wheel" class="wheel"></div></div><div class="pointer"></div><button class="spin" onclick="spin()">立即抽奖</button></div><div class="chance">剩余抽奖次数：<b id="chanceCount">3</b> 次</div></div></section><section class="section"><div class="title">获取抽奖机会</div><div class="tabs"><button class="on" data-tab="bet">投注赠送</button><button data-tab="recharge">充值赠送</button><button data-tab="login">每日登录</button></div><div id="bet" class="panel on"></div><div id="recharge" class="panel"></div><div id="login" class="panel"></div></section><section class="section"><div class="title">我的抽奖机会</div><div class="stats"><div class="stat"><b id="leftCount">3</b>剩余抽奖次数</div><div class="stat"><b id="gainCount">8</b>累计获得</div><div class="stat"><b id="usedCount">5</b>累计使用</div></div><button class="record-btn">我的抽奖记录</button><div class="marquee-box"><strong>最新中奖名单　</strong><span class="marquee">天***6 获得 流水券888元　　幸***2 获得 存送券18元　　会***8 获得 现金券5元</span></div></section><section class="card"><h2>活动规则</h2><p>活动资格、抽奖机会获取及奖品发放以平台最终规则为准。</p></section></div></main></div><div id="toast" style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;padding:10px 18px;border-radius:8px;display:none;z-index:300"></div><script>const viewport=document.getElementById('viewport'),pcBtn=document.getElementById('pcBtn'),h5Btn=document.getElementById('h5Btn');function setMode(m){viewport.className='viewport '+m;pcBtn.classList.toggle('on',m==='pc');h5Btn.classList.toggle('on',m==='h5');setTimeout(()=>window.dispatchEvent(new Event('resize')),300);window.scrollTo({top:0,behavior:'smooth'})}const rewards=[['现金券','5元','🎁'],['流水券','88元','🎟️'],['存送券','18元','🧧'],['谢谢惠顾','','✨'],['现金券','15元','🎁'],['流水券','188元','🎟️'],['存送券','28元','🧧'],['现金券','50元','🎁']],wheel=document.getElementById('wheel');rewards.forEach((r,i)=>{let e=document.createElement('div');e.className='reward';e.style.transform=`rotate(${i*45+22.5}deg) translate(60px,-12px) rotate(${-i*45-22.5}deg)`;e.innerHTML=`<span>${r[2]}</span><span>${r[0]}</span><b>${r[1]}</b>`;wheel.appendChild(e)});let rot=0,busy=false,chance=3,used=5,gained=8;function spin(){if(busy||chance<1)return;busy=true;let i=Math.floor(Math.random()*8);rot+=1440+360-i*45;wheel.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{chance--;used++;chanceCount.textContent=leftCount.textContent=chance;usedCount.textContent=used;show(rewards[i][0]==='谢谢惠顾'?'谢谢惠顾，再接再厉！':`恭喜获得 ${rewards[i][0]} ${rewards[i][1]}`);busy=false},3900)}function rows(id,a){document.getElementById(id).innerHTML=a.map(x=>`<div class="row"><div>${x.g}</div><div>赠送${x.n}次</div><div>${x.c}/${x.t}<div class="progress"><div class="bar" style="width:${Math.min(100,x.c/x.t*100)}%"></div></div></div><div class="status ${x.s==='可领取'?'claim':''}">${x.s}</div></div>`).join('')}rows('bet',[{g:'有效投注100',n:1,c:100,t:100,s:'可领取'},{g:'有效投注500',n:5,c:450,t:500,s:'未达标'},{g:'有效投注1000',n:12,c:0,t:1000,s:'未达标'}]);rows('recharge',[{g:'充值100',n:1,c:100,t:100,s:'已领取'},{g:'充值500',n:6,c:120,t:500,s:'未达标'}]);rows('login',[{g:'每日首次登录',n:1,c:1,t:1,s:'可领取'}]);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});function show(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}</script><script>(function(){const c=document.getElementById('fireworksCanvas'),x=c.getContext('2d');let W,H,d=Math.min(devicePixelRatio||1,2),p=[];function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}function burst(){let cx=W*(.12+Math.random()*.76),cy=H*(.08+Math.random()*.5);for(let i=0;i<30;i++){let a=Math.PI*2*i/30,s=40+Math.random()*60;p.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}}let last=0;function f(t){x.clearRect(0,0,W,H);if(t-last>900){burst();last=t}p.forEach((q,i)=>{q.vy+=.25;q.x+=q.vx/60;q.y+=q.vy/60;q.l-=.018;x.globalAlpha=Math.max(0,q.l);x.fillStyle='#ffd76a';x.beginPath();x.arc(q.x,q.y,1.5,0,7);x.fill();if(q.l<=0)p.splice(i,1)});x.globalAlpha=1;requestAnimationFrame(f)}resize();addEventListener('resize',resize);requestAnimationFrame(f)})();</script></body></html>
