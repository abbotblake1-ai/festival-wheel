<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国庆豪礼大转盘</title><style>*{box-sizing:border-box}body{margin:0;background:#180303;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif}.toolbar{height:52px;background:#11151b;display:flex;justify-content:center;align-items:center;gap:10px;position:sticky;top:0;z-index:50}.toolbar button{padding:9px 20px;border-radius:7px;border:1px solid #46505e;background:#202630;color:#ddd}.toolbar .on{background:#2463df;color:#fff}.viewport{margin:auto;overflow:hidden;background:#5b0808}.pc{width:100%}.h5{width:min(390px,100vw);margin:12px auto 30px;box-shadow:0 0 45px #000}.hero{height:clamp(280px,38vw,600px);position:relative;overflow:hidden;background:radial-gradient(circle at 50% 38%,#ffbd4b 0,#e52a14 25%,#a20c0c 65%,#5e0608 100%)}.hero:before,.hero:after{content:"";position:absolute;bottom:-8%;width:58%;height:45%;background:#b20f0d;border-radius:50% 50% 0 0;opacity:.75}.hero:before{left:-18%;transform:rotate(8deg)}.hero:after{right:-18%;transform:rotate(-8deg)}.flag{position:absolute;left:4%;top:8%;font-size:clamp(35px,5vw,80px);color:#ffd84b;text-shadow:30px 20px 0 #ffd84b,58px 5px 0 #ffd84b,45px 48px 0 #ffd84b}.lantern{position:absolute;right:6%;top:5%;font-size:clamp(55px,8vw,120px);filter:drop-shadow(0 0 18px #ffbf45)}.skyline{position:absolute;left:0;right:0;bottom:0;height:27%;background:linear-gradient(90deg,transparent 3%,#8d100b 3% 8%,transparent 8% 11%,#7d0b09 11% 16%,transparent 16% 73%,#8d100b 73% 79%,transparent 79% 83%,#740908 83% 90%,transparent 90%)}.gate{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:34%;height:18%;border:5px solid #f5b63f;border-top:12px double #f5b63f}.heroText{position:absolute;z-index:3;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;width:80%}.heroText h1{font-size:clamp(38px,6vw,92px);margin:0;color:#ffe181;text-shadow:0 5px 0 #9d180c,0 0 25px #ffcf5b}.heroText p{display:inline-block;padding:9px 35px;margin-top:18px;background:#b41d12;border:2px solid #ffc447;color:#fff1bc;font-size:clamp(14px,2vw,25px)}#fireworks{position:absolute;inset:0;width:100%;height:100%}.page{position:relative;padding:24px 0 70px;background:radial-gradient(circle at 12% 12%,rgba(255,190,54,.15),transparent 18%),radial-gradient(circle at 88% 35%,rgba(255,80,25,.18),transparent 20%),linear-gradient(#8d100d,#520707 60%,#290404)}.page:before{content:"♠  ♥  ♦  ♣    777    ★    ♠  ♥  ♦  ♣    888    ★";position:absolute;inset:0;color:rgba(255,201,87,.055);font-size:70px;line-height:180px;word-spacing:35px;overflow:hidden;pointer-events:none}.container{position:relative;width:min(1160px,94%);margin:auto}.card{margin:18px 0;border:1px solid rgba(255,205,95,.35);border-radius:18px;background:rgba(92,6,7,.82);box-shadow:0 15px 35px rgba(0,0,0,.22);overflow:hidden}.textCard{text-align:center;padding:22px}.title{text-align:center;color:#ffdc7a;font-size:28px;font-weight:bold;padding:22px 10px 8px}.wheelArea{padding:12px 10px 30px}.stage{width:410px;height:430px;position:relative;margin:auto}.base{position:absolute;left:75px;bottom:5px;width:260px;height:65px;border-radius:50% 50% 18% 18%;background:linear-gradient(#ffc84e,#9e190d)}.outer{position:absolute;left:15px;top:10px;width:380px;height:380px;border-radius:50%;background:linear-gradient(135deg,#ffd55e,#d73513,#ffd65b);box-shadow:0 0 0 8px #8d130a,0 0 35px #ffb331;display:grid;place-items:center}.wheel{width:330px;height:330px;border-radius:50%;position:relative;overflow:hidden;background:conic-gradient(#ffe39a 0 45deg,#f35a32 45deg 90deg,#ffe39a 90deg 135deg,#f35a32 135deg 180deg,#ffe39a 180deg 225deg,#f35a32 225deg 270deg,#ffe39a 270deg 315deg,#f35a32 315deg);transition:transform 3.6s cubic-bezier(.12,.75,.1,1)}.prize{position:absolute;left:50%;top:50%;width:78px;text-align:center;transform-origin:0 0;color:#7c160c;font-weight:bold;font-size:12px;line-height:1.25}.prize .ico{font-size:24px}.pointer{position:absolute;z-index:6;left:50%;top:19px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:62px solid #a4140c;filter:drop-shadow(0 2px 2px #5b0906)}.spin{position:absolute;z-index:7;left:50%;top:200px;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;border:7px solid #ffd05a;background:radial-gradient(circle at 35% 25%,#ffe477,#ef6c24 35%,#bd1c0e 72%);color:#fff;font-weight:bold;font-size:19px;cursor:pointer}.spin small{display:block;font-size:12px;color:#ffe39b;margin-top:4px}.tabs{display:flex;justify-content:center;gap:10px;padding:12px}.tabs button{padding:10px 28px;border-radius:20px;border:1px solid #c44b2b;background:#6e0e0b;color:#ffd8a4;cursor:pointer}.tabs .on{background:linear-gradient(#ff9c31,#d73d18);color:#fff}.panel{display:none;padding:0 20px 22px}.panel.on{display:block}.row{display:grid;grid-template-columns:160px 100px 1fr 90px;gap:12px;align-items:center;padding:13px;border-bottom:1px solid rgba(255,255,255,.09)}.progress{height:10px;background:#350404;border-radius:8px;overflow:hidden;margin-top:5px}.bar{height:100%;background:linear-gradient(90deg,#ffb13a,#ff6127)}.status{text-align:center;color:#ffc17a}.claim{background:#e65a22;color:#fff;padding:7px;border-radius:15px;cursor:pointer}.done{opacity:.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 22px}.stat{text-align:center;padding:15px;background:#500707;border-radius:12px}.stat b{display:block;color:#ffdc76;font-size:25px}.record{display:block;margin:0 auto 18px;padding:9px 22px;border-radius:20px;border:1px solid #e99b42;background:#76100c;color:#ffd9a0}.marqueeBox{padding:13px;white-space:nowrap;overflow:hidden;border-top:1px solid rgba(255,255,255,.1)}.marquee{display:inline-block;color:#ffe2b2;animation:move 18s linear infinite}@keyframes move{from{transform:translateX(20%)}to{transform:translateX(-100%)}}#toast{display:none;position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);padding:11px 20px;background:#111;border-radius:8px}.h5 .hero{height:285px}.h5 .heroText{top:43%;width:92%}.h5 .heroText h1{font-size:35px}.h5 .heroText p{font-size:12px;padding:6px 14px;margin-top:8px}.h5 .flag{font-size:28px}.h5 .lantern{font-size:48px}.h5 .page{padding-top:8px}.h5 .container{width:100%;padding:0 9px}.h5 .card{margin:9px 0;border-radius:13px}.h5 .textCard{padding:14px;font-size:12px}.h5 .title{font-size:20px;padding-top:15px}.h5 .stage{width:300px;height:320px}.h5 .outer{width:280px;height:280px;left:10px}.h5 .wheel{width:240px;height:240px}.h5 .base{width:190px;height:48px;left:55px}.h5 .pointer{top:16px;border-left-width:14px;border-right-width:14px;border-top-width:44px}.h5 .spin{top:150px;width:82px;height:82px;border-width:5px;font-size:14px}.h5 .spin small{font-size:10px}.h5 .prize{font-size:9px;width:58px}.h5 .prize .ico{font-size:17px}.h5 .tabs{gap:4px;padding:8px}.h5 .tabs button{flex:1;padding:8px 1px;font-size:11px}.h5 .panel{padding:0 7px 12px}.h5 .row{grid-template-columns:74px 53px 1fr 52px;gap:4px;padding:9px 2px;font-size:10px}.h5 .stats{padding:8px;gap:5px}.h5 .stat{padding:9px 2px;font-size:10px}.h5 .stat b{font-size:19px}.h5 .marqueeBox{font-size:10px;padding:10px 6px}</style></head><body><div class="toolbar"><button id="pcBtn" class="on" onclick="mode('pc')">PC预览</button><button id="h5Btn" onclick="mode('h5')">H5预览</button></div><div id="viewport" class="viewport pc"><header class="hero"><canvas id="fireworks"></canvas><div class="flag">★</div><div class="lantern">🏮</div><div class="skyline"></div><div class="gate"></div><div class="heroText"><h1>国庆豪礼大转盘</h1><p>幸运转不停 · 豪礼享不停</p></div></header><main class="page"><div class="container"><section class="card textCard"><h2>活动内容</h2><div>活动期间完成投注、充值、每日登录任务，即可获得抽奖机会。达到条件后可领取对应抽奖次数。</div></section><section class="card"><div class="title">幸运大转盘</div><div class="wheelArea"><div class="stage"><div class="base"></div><div class="outer"><div id="wheel" class="wheel"></div></div><div class="pointer"></div><button class="spin" onclick="spin()">立即抽奖<small>剩余 <b id="centerChance">3</b> 次</small></button></div></div></section><section class="card"><div class="title">获取抽奖机会</div><div class="tabs"><button class="on" data-tab="bet">投注赠送</button><button data-tab="recharge">充值赠送</button><button data-tab="login">每日登录</button></div><div id="bet" class="panel on"></div><div id="recharge" class="panel"></div><div id="login" class="panel"></div></section><section class="card"><div class="title">我的抽奖机会</div><div class="stats"><div class="stat"><b id="left">3</b>剩余抽奖次数</div><div class="stat"><b id="gain">8</b>累计获得</div><div class="stat"><b id="used">5</b>累计使用</div></div><button class="record">我的抽奖记录</button><div class="marqueeBox"><b>最新中奖名单　</b><span class="marquee">天***6 获得 流水券888元　　幸***2 获得 存送券18元　　会***8 获得 现金券5元</span></div></section><section class="card textCard"><h2>活动规则</h2><div>活动资格、抽奖机会获取及奖品发放以平台最终规则为准。</div></section></div></main></div><div id="toast"></div><script>const V=document.getElementById('viewport'),wheel=document.getElementById('wheel');function mode(m){V.className='viewport '+m;pcBtn.classList.toggle('on',m==='pc');h5Btn.classList.toggle('on',m==='h5');setTimeout(()=>dispatchEvent(new Event('resize')),50)}const prizes=[['现金券','5元','💰'],['流水券','88元','🎫'],['存送券','18元','🧧'],['谢谢惠顾','','✨'],['现金券','15元','💰'],['流水券','188元','🎫'],['存送券','28元','🧧'],['现金券','50元','💰']];function placePrizes(){wheel.innerHTML='';let mobile=V.classList.contains('h5'),radius=mobile?67:94;prizes.forEach((p,i)=>{let d=document.createElement('div'),a=i*45+22.5;d.className='prize';d.style.transform=`rotate(${a}deg) translate(${radius}px,-18px) rotate(${-a}deg)`;d.innerHTML=`<div class="ico">${p[2]}</div><div>${p[0]}</div><div>${p[1]}</div>`;wheel.appendChild(d)})}placePrizes();const oldMode=mode;mode=function(m){V.className='viewport '+m;pcBtn.classList.toggle('on',m==='pc');h5Btn.classList.toggle('on',m==='h5');placePrizes();setTimeout(()=>dispatchEvent(new Event('resize')),50)};let chance=3,gained=8,use=5,busy=false,rot=0;function sync(){centerChance.textContent=left.textContent=chance;gain.textContent=gained;used.textContent=use}function spin(){if(busy)return;if(chance<1)return pop('暂无抽奖次数');busy=true;let i=Math.floor(Math.random()*8);rot+=1440+360-i*45;wheel.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{chance--;use++;sync();pop(prizes[i][0]==='谢谢惠顾'?'谢谢惠顾，再接再厉！':`恭喜获得 ${prizes[i][0]} ${prizes[i][1]}`);busy=false},3700)}function render(id,data){document.getElementById(id).innerHTML=data.map((x,i)=>`<div class="row"><div>${x.g}</div><div>赠送${x.n}次</div><div>${x.c}/${x.t}<div class="progress"><div class="bar" style="width:${Math.min(100,x.c/x.t*100)}%"></div></div></div><div class="status ${x.s==='可领取'?'claim':''} ${x.s==='已领取'?'done':''}" ${x.s==='可领取'?`onclick="claim(this,${x.n})"`:''}>${x.s}</div></div>`).join('')}render('bet',[{g:'有效投注100',n:1,c:100,t:100,s:'可领取'},{g:'有效投注300',n:2,c:260,t:300,s:'未达标'},{g:'有效投注500',n:3,c:260,t:500,s:'未达标'},{g:'有效投注1000',n:6,c:260,t:1000,s:'未达标'},{g:'有效投注3000',n:12,c:260,t:3000,s:'未达标'}]);render('recharge',[{g:'充值100',n:1,c:100,t:100,s:'可领取'},{g:'充值300',n:2,c:180,t:300,s:'未达标'},{g:'充值500',n:3,c:180,t:500,s:'未达标'},{g:'充值1000',n:6,c:180,t:1000,s:'未达标'},{g:'充值3000',n:12,c:180,t:3000,s:'未达标'}]);render('login',[{g:'每日登录',n:1,c:1,t:1,s:'可领取'}]);function claim(el,n){if(!el.classList.contains('claim'))return;el.textContent='已领取';el.classList.remove('claim');el.classList.add('done');chance+=n;gained+=n;sync();pop(`领取成功，获得 ${n} 次抽奖机会`)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});function pop(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',1800)}(function(){const c=fireworks,x=c.getContext('2d');let W,H,P=[],last=0;function rs(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}function burst(){let cx=W*(.15+Math.random()*.7),cy=H*(.08+Math.random()*.45);for(let i=0;i<32;i++){let a=i/32*Math.PI*2,s=35+Math.random()*55;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}}function f(t){x.clearRect(0,0,W,H);if(t-last>900){burst();last=t}P=P.filter(q=>{q.vy+=.2;q.x+=q.vx/60;q.y+=q.vy/60;q.l-=.018;x.globalAlpha=Math.max(0,q.l);x.fillStyle='#ffe071';x.beginPath();x.arc(q.x,q.y,1.5,0,7);x.fill();return q.l>0});x.globalAlpha=1;requestAnimationFrame(f)}rs();addEventListener('resize',rs);requestAnimationFrame(f)})();</script></body></html>
