<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国庆豪礼大转盘</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#160203;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}.toolbar{height:52px;background:#0f1217;display:flex;justify-content:center;align-items:center;gap:10px;position:sticky;top:0;z-index:1000}.toolbar button{padding:8px 20px;border:1px solid #46505e;border-radius:7px;background:#1e242d;color:#dce2ea;cursor:pointer}.toolbar button.on{background:#2463df;border-color:#2463df;color:#fff}.viewport{width:100%;overflow:hidden;background:#600708}.viewport.h5{width:min(390px,100vw);margin:12px auto 30px;border-radius:20px;box-shadow:0 24px 80px #000}.hero{position:relative;width:100%;overflow:hidden;background:#4b0507}.pc .hero{height:76vh;min-height:560px;max-height:860px}.h5 .hero{height:76vh;min-height:560px;max-height:760px}.hero picture,.hero img{display:block;width:100%;height:100%}.hero img{object-fit:cover}.pc .hero img{object-position:center}.h5 .hero img{object-position:center top}.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.page{padding:22px 0 70px;background:radial-gradient(circle at 50% 0,rgba(255,179,45,.15),transparent 22%),linear-gradient(180deg,#a71814,#760b0b 48%,#430405)}.container{width:min(1160px,92%);margin:auto}.section{margin:20px 0;border:1px solid #efc86d;border-radius:22px;background:linear-gradient(180deg,#fbefd5,#f4e2bd);color:#5a301b;overflow:hidden;box-shadow:0 16px 38px rgba(44,0,0,.22)}.section-head{text-align:center;padding:20px 12px 10px}.pill{display:inline-block;padding:10px 36px;border-radius:999px;background:#fff9ec;border:2px solid #f2b94a;color:#d73325;font-size:24px;font-weight:900}.content{padding:16px 28px 26px;text-align:center;line-height:1.9}.wheel-wrap{padding:4px 10px 34px}.stage{position:relative;width:500px;height:500px;margin:auto}.base{position:absolute;left:90px;bottom:0;width:320px;height:80px;border-radius:50% 50% 22% 22%;background:linear-gradient(#ef3c35,#a70f0e);box-shadow:0 16px 25px rgba(70,0,0,.28)}.base:before{content:"";position:absolute;left:34px;right:34px;top:-30px;height:62px;background:linear-gradient(#ef3c35,#a60e0e);clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);border-top:3px solid #ffb84b}.frame{position:absolute;left:32px;top:0;width:436px;height:436px;border-radius:50%;background:linear-gradient(145deg,#f63e37,#a70e0d 48%,#ed342e);box-shadow:0 0 0 7px #890c0a,0 0 34px rgba(255,90,40,.3);display:grid;place-items:center}.frame:before{content:"";position:absolute;inset:8px;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 8deg,#ffe56d 8deg 10deg,transparent 10deg 18deg);animation:bulb .9s steps(2) infinite}@keyframes bulb{50%{filter:brightness(2)}}.rotor{position:relative;width:370px;height:370px;border-radius:50%;border:5px solid #8c100b;background:conic-gradient(from -22.5deg,#f1c59f 0 45deg,#f1c9d8 45deg 90deg,#bfd1ef 90deg 135deg,#bfe1bd 135deg 180deg,#efc6d3 180deg 225deg,#b9cae8 225deg 270deg,#f1c49d 270deg 315deg,#f4cdc7 315deg 360deg);transition:transform 3.8s cubic-bezier(.12,.76,.1,1)}.prize{position:absolute;width:86px;text-align:center;transform:translate(-50%,-50%);font-weight:900;line-height:1.13;color:#5f2b18}.prize .ico{display:inline-grid;place-items:center;width:40px;height:28px;border-radius:7px;color:#fff;font-size:18px;margin-bottom:4px;box-shadow:inset 0 -3px rgba(0,0,0,.13)}.cash .ico{background:#db302d}.flow .ico{background:#2c67d0}.deposit .ico{background:#4aa84f}.none .ico{background:#f3cc5a;color:#754600}.prize .name{font-size:12px}.prize .value{font-size:14px}.spin{position:absolute;z-index:12;left:50%;top:218px;transform:translate(-50%,-50%);width:116px;height:116px;border-radius:50%;border:7px solid #e7bd68;background:radial-gradient(circle at 40% 25%,#ff9e32,#f03e18 43%,#b9140d 82%);color:#fff;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 6px 18px rgba(75,0,0,.32)}.spin small{display:block;font-size:11px;margin-top:4px;color:#ffe6aa}.pointer{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:22px;height:29px;background:linear-gradient(#ff5a3e,#c91511);clip-path:polygon(50% 0,100% 56%,66% 100%,34% 100%,0 56%);filter:drop-shadow(0 2px 1px rgba(80,0,0,.35))}.pointer:after{content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:#ffd36a;border:2px solid #fff0a0}.tabs{display:flex;justify-content:center;gap:10px;padding:8px 20px 18px}.tabs button{min-width:150px;padding:11px 24px;border:1px solid #efb44d;border-radius:10px;background:#fff8e9;color:#6a3a22;cursor:pointer;font-weight:800}.tabs button.on{background:linear-gradient(#f04738,#d81f1c);color:#fff;border-color:#e22a22}.panel{display:none;padding:0 24px 28px}.panel.on{display:block}.head,.row{display:grid;grid-template-columns:190px 120px 1fr 105px;gap:14px;align-items:center}.head{padding:12px 14px;background:#fff7e8;border-radius:12px;color:#7a4d33;font-weight:800}.row{padding:14px;border-bottom:1px solid #ead8b5}.goal{font-weight:800}.gift{color:#df3024;font-weight:900}.pt{font-size:12px;color:#8d6b53;margin-bottom:5px}.progress{height:11px;background:#eadfcf;border-radius:10px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffb33b,#ff6a1f)}.status{text-align:center;color:#9b897b;font-size:13px}.status.claim{background:#15a64a;color:#fff;padding:7px;border-radius:17px;cursor:pointer}.status.done{opacity:.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 24px}.stat{text-align:center;padding:17px;background:#fff8e9;border-radius:13px;border:1px solid #eed7aa;color:#7b573e}.stat b{display:block;color:#e6382a;font-size:28px}.record{display:block;margin:0 auto 18px;border:0;background:linear-gradient(#f2483a,#cf1d19);color:#fff;padding:10px 24px;border-radius:20px;cursor:pointer;font-weight:800}.marquee{display:flex;gap:18px;overflow:hidden;white-space:nowrap;padding:13px 22px;border-top:1px solid #ead9b5}.marquee strong{color:#d52e22;flex:none}.track{display:inline-block;color:#6d4b37;animation:move 18s linear infinite}@keyframes move{from{transform:translateX(20%)}to{transform:translateX(-100%)}}.modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.68);align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(520px,92vw);background:#fff7e8;color:#5c341e;border:2px solid #efbd5b;border-radius:18px;overflow:hidden}.mh{display:flex;justify-content:space-between;padding:17px 20px;font-weight:900;font-size:20px;border-bottom:1px solid #ead8b4}.mb{padding:12px 20px}.rr{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ead8b4}.toast{display:none;position:fixed;z-index:500;left:50%;bottom:28px;transform:translateX(-50%);background:#111;padding:10px 18px;border-radius:8px}.h5 .page{padding:8px 0 42px}.h5 .container{width:100%;padding:0 8px}.h5 .section{margin:9px 0;border-radius:16px}.h5 .section-head{padding:15px 8px 7px}.h5 .pill{font-size:18px;padding:7px 24px}.h5 .content{padding:12px 14px 18px;font-size:12px}.h5 .wheel-wrap{padding:2px 2px 18px}.h5 .stage{width:310px;height:330px}.h5 .frame{width:292px;height:292px;left:9px}.h5 .rotor{width:250px;height:250px;border-width:4px}.h5 .base{left:55px;width:200px;height:50px}.h5 .base:before{left:25px;right:25px;top:-22px;height:46px}.h5 .spin{top:148px;width:82px;height:82px;border-width:5px;font-size:14px}.h5 .spin small{font-size:9px}.h5 .pointer{top:-16px;width:18px;height:24px}.h5 .pointer:after{width:5px;height:5px;bottom:3px}.h5 .prize{width:62px}.h5 .prize .ico{width:30px;height:22px;font-size:13px}.h5 .prize .name{font-size:9px}.h5 .prize .value{font-size:10px}.h5 .tabs{gap:4px;padding:7px}.h5 .tabs button{flex:1;min-width:0;padding:8px 1px;font-size:11px}.h5 .panel{padding:0 7px 12px}.h5 .head,.h5 .row{grid-template-columns:78px 55px minmax(0,1fr) 54px;gap:4px}.h5 .head{padding:8px 2px;font-size:9px}.h5 .row{padding:9px 2px;font-size:10px}.h5 .pt{font-size:9px}.h5 .status.claim{font-size:10px;padding:5px 2px}.h5 .stats{padding:8px;gap:5px}.h5 .stat{padding:10px 2px;font-size:10px}.h5 .stat b{font-size:20px}.h5 .marquee{font-size:11px;padding:10px}
</style>
</head>
<body>
<div class="toolbar"><button id="pcBtn" class="on">PC预览</button><button id="h5Btn">H5预览</button></div>
<div id="view" class="viewport pc">
<section class="hero"><picture><source id="heroSource" media="(max-width:600px)" srcset="assets/wheel-h5-banner.svg"><img id="heroImg" src="assets/wheel-pc-banner.svg" alt="国庆豪礼大转盘"></picture><canvas id="heroFx"></canvas></section>
<main class="page"><div class="container">
<section class="section"><div class="section-head"><span class="pill">活动内容</span></div><div class="content">活动期间完成投注、充值、每日登录任务，即可获得抽奖机会。达到任务条件后可领取对应抽奖次数，抽奖机会当日有效。</div></section>
<section class="section"><div class="section-head"><span class="pill">幸运大转盘</span></div><div class="wheel-wrap"><div class="stage"><div class="base"></div><div class="frame"><div id="rotor" class="rotor"></div></div><button id="spin" class="spin"><span class="pointer"></span>立即抽奖<small>剩余 <span id="spinCount">3</span> 次</small></button></div></div></section>
<section class="section"><div class="section-head"><span class="pill">获取抽奖机会</span></div><div class="tabs"><button class="on" data-tab="bet">投注赠送</button><button data-tab="recharge">充值赠送</button><button data-tab="login">每日登录</button></div><div id="bet" class="panel on"></div><div id="recharge" class="panel"></div><div id="login" class="panel"></div></section>
<section class="section"><div class="section-head"><span class="pill">我的抽奖机会</span></div><div class="stats"><div class="stat"><b id="leftCount">3</b>剩余次数</div><div class="stat"><b id="gainCount">3</b>累计获得</div><div class="stat"><b id="usedCount">0</b>累计使用</div></div><button class="record" id="recordBtn">我的抽奖记录</button><div class="marquee"><strong>最新中奖名单</strong><span class="track">天***6 获得 流水券888元　　幸***2 获得 存送券18元　　会***8 获得 现金券50元　　U***9 获得 现金券15元</span></div></section>
<section class="section"><div class="section-head"><span class="pill">活动规则</span></div><div class="content">1. 活动期间完成指定任务可获得抽奖机会；2. 抽奖机会有效期按后台配置执行；3. 奖品以实际抽奖结果及福利中心记录为准。</div></section>
</div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="mh"><span>我的抽奖记录</span><span id="close" style="cursor:pointer">×</span></div><div class="mb"><div class="rr"><span>2026-08-22 16:32</span><b>现金券 15元</b></div><div class="rr"><span>2026-08-22 14:10</span><b>谢谢惠顾</b></div></div></div></div><div id="toast" class="toast"></div>
<script>
const prizes=[{name:'现金券',value:'5元',type:'cash',icon:'¥'},{name:'流水券',value:'888元',type:'flow',icon:'↻'},{name:'存送券',value:'18元',type:'deposit',icon:'¥'},{name:'现金券',value:'15元',type:'cash',icon:'¥'},{name:'流水券',value:'1888元',type:'flow',icon:'↻'},{name:'存送券',value:'28元',type:'deposit',icon:'¥'},{name:'流水券',value:'588元',type:'flow',icon:'↻'},{name:'现金券',value:'3元',type:'cash',icon:'¥'}];
const rotor=document.getElementById('rotor');function layoutPrizes(){const size=rotor.clientWidth,c=size/2,r=size*.35;rotor.querySelectorAll('.prize').forEach(n=>n.remove());prizes.forEach((p,i)=>{const a=i*45*Math.PI/180,x=c+r*Math.sin(a),y=c-r*Math.cos(a),d=document.createElement('div');d.className=`prize ${p.type}`;d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<span class="ico">${p.icon}</span><div class="name">${p.name}</div><div class="value">${p.value}</div>`;rotor.appendChild(d)})}layoutPrizes();
let chance=3,gained=3,used=0,rotation=0,busy=false;function sync(){spinCount.textContent=chance;leftCount.textContent=chance;gainCount.textContent=gained;usedCount.textContent=used}function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>toast.style.display='none',1800)}
spin.onclick=()=>{if(busy)return;if(chance<=0)return toastMsg('暂无抽奖次数');busy=true;const idx=Math.floor(Math.random()*prizes.length),target=(360-idx*45)%360,current=((rotation%360)+360)%360,delta=(target-current+360)%360;rotation+=1800+delta;rotor.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{chance--;used++;sync();toastMsg(`恭喜获得 ${prizes[idx].name} ${prizes[idx].value}`);busy=false},3900)};
const data={bet:[[100,1,100],[500,5,350],[1000,12,350],[3000,40,350],[5000,80,350]],recharge:[[100,1,100],[500,6,200],[1000,15,200],[3000,50,200],[5000,100,200]],login:[[1,1,1]]};function render(id,rows){document.getElementById(id).innerHTML='<div class="head"><span>达成条件</span><span>赠送次数</span><span>当前进度</span><span>状态</span></div>'+rows.map(r=>{const ok=r[2]>=r[0],label=id==='login'?'每日首次登录':id==='bet'?`有效投注 ${r[0]} 元`:`充值 ${r[0]} 元`;return `<div class="row"><div class="goal">${label}</div><div class="gift">+${r[1]}次</div><div><div class="pt">${Math.min(r[2],r[0])}/${r[0]}</div><div class="progress"><div class="bar" style="width:${Math.min(100,r[2]/r[0]*100)}%"></div></div></div><div class="status ${ok?'claim':''}" data-gift="${r[1]}">${ok?'可领取':'未达标'}</div></div>`}).join('')}render('bet',data.bet);render('recharge',data.recharge);render('login',data.login);
document.addEventListener('click',e=>{if(e.target.classList.contains('claim')){const n=+e.target.dataset.gift;e.target.classList.remove('claim');e.target.classList.add('done');e.target.textContent='已领取';chance+=n;gained+=n;sync();toastMsg(`领取成功，获得 ${n} 次抽奖机会`)}});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.tab).classList.add('on')});
function setMode(m){view.className='viewport '+m;pcBtn.classList.toggle('on',m==='pc');h5Btn.classList.toggle('on',m==='h5');heroImg.src=m==='h5'?'assets/wheel-h5-banner.svg':'assets/wheel-pc-banner.svg';heroSource.srcset=m==='h5'?'assets/wheel-h5-banner.svg':'assets/wheel-pc-banner.svg';setTimeout(()=>{layoutPrizes();resizeFx()},50)}pcBtn.onclick=()=>setMode('pc');h5Btn.onclick=()=>setMode('h5');recordBtn.onclick=()=>modal.classList.add('show');close.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
const cvs=document.getElementById('heroFx'),ctx=cvs.getContext('2d');let particles=[];function resizeFx(){const r=cvs.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cvs.width=r.width*d;cvs.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}function burst(){const w=cvs.clientWidth,h=cvs.clientHeight,x=w*(.1+Math.random()*.8),y=h*(.04+Math.random()*.48),color=['#ffd45a','#ff8134','#fff0a7','#ff3c56'][Math.floor(Math.random()*4)];for(let i=0;i<38;i++){const a=Math.PI*2*i/38,s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color})}}function animate(){ctx.clearRect(0,0,cvs.clientWidth,cvs.clientHeight);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.012;p.life-=.014;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,1.55,0,7);ctx.fill()});ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(animate)}window.addEventListener('resize',()=>{resizeFx();layoutPrizes()});resizeFx();animate();setInterval(burst,900);burst();setTimeout(burst,350);
</script></body></html>
