<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日大转盘后台</title><style>html,body,#main{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="main" src="main-v2.html?v=202608111145"></iframe><script>const f=document.getElementById('main');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;w.openEditor=function(edit){const box=d.getElementById('editor'),ef=d.getElementById('editorFrame');box.style.display='block';ef.src='wheel-editor-v4.html?mode='+(edit?'edit':'new')+'&t='+Date.now();ef.onload=()=>{try{const ed=ef.contentDocument;if(!ed||ed.__tierInteractionBound)return;ed.__tierInteractionBound=true;function renumber(tbody){[...tbody.querySelectorAll('tr')].forEach((tr,i)=>{const first=tr.cells&&tr.cells[0];if(first)first.textContent=String(i+1)})}ed.addEventListener('click',ev=>{const btn=ev.target.closest('button');if(!btn)return;const text=btn.textContent.trim();if(text.includes('新增档位')){ev.preventDefault();const table=ed.querySelector('.chance-config table.table');if(!table)return;const tbody=table.querySelector('tbody');if(!tbody)return;const last=tbody.lastElementChild;let tr;if(last){tr=last.cloneNode(true);tr.querySelectorAll('input').forEach(inp=>inp.value='')}else{tr=ed.createElement('tr');tr.innerHTML='<td></td><td><input class="input small" value=""></td><td><input class="input small" value=""> 次</td><td><button class="btn danger">删除</button></td>'}tbody.appendChild(tr);renumber(tbody);const input=tr.querySelector('input');if(input)input.focus()}else if(text==='删除'){const tr=btn.closest('tr');const tbody=tr&&tr.parentElement;if(tr&&tbody){ev.preventDefault();tr.remove();renumber(tbody)}}},true)}catch(e){console.error('tier interaction bind failed',e)}}};w.addEventListener('message',e=>{if(e.data==='closeEditor'){d.getElementById('editor').style.display='none';d.getElementById('editorFrame').src='about:blank'}})};</script></body></html>
