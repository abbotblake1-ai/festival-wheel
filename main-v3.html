<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日大转盘后台</title><style>html,body,#main{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="main" src="main-v2.html"></iframe><script>const f=document.getElementById('main');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;w.openEditor=function(edit){const box=d.getElementById('editor'),ef=d.getElementById('editorFrame');box.style.display='block';ef.src='wheel-editor-v5.html?mode='+(edit?'edit':'new')+'&t='+Date.now();ef.onload=()=>{try{const ed=ef.contentDocument,ew=ef.contentWindow;const title=ed.getElementById('pageTitle');if(title){title.textContent=edit?'编辑：国庆大转盘':'新增国庆大转盘';title.style.position='absolute';title.style.left='50%';title.style.transform='translateX(-50%)';title.style.whiteSpace='nowrap'}const st=ed.createElement('style');st.textContent='.tabs{grid-template-columns:repeat(6,1fr)!important}.method-actions{display:flex;gap:8px;align-items:center}.method-add{max-width:1380px;margin:0 auto 16px;display:flex;justify-content:flex-end}.method-picker{display:flex;flex-wrap:wrap;gap:12px}.method-choice{padding:12px 18px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;cursor:pointer}.method-choice.used{background:#f2f4f7;color:#98a2b3;cursor:not-allowed}.venue-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}.sector-empty{color:#98a2b3}';ed.head.appendChild(st);const tabs=ed.getElementById('tabs');const trim=()=>{if(tabs&&tabs.children.length>6)[...tabs.children].slice(6).forEach(x=>x.remove())};trim();if(tabs)new MutationObserver(trim).observe(tabs,{childList:true});let methods=[{id:'bet',name:'投注赠送',desc:'会员达到指定有效投注金额后，获得对应抽奖次数。',on:true},{id:'recharge',name:'充值赠送',desc:'会员达到指定充值金额后，获得对应抽奖次数。',on:true},{id:'daily',name:'每日登录',desc:'会员每日登录成功后赠送抽奖次数，每日仅触发1次。',on:true}];const catalog=[['bet','投注赠送'],['recharge','充值赠送'],['daily','每日登录'],['continuous','连续登录'],['cumulative','累计登录'],['invite','邀请好友'],['firstRecharge','首次充值'],['register','注册赠送'],['manual','后台赠送']];let cur='bet',rows={bet:[[100,1],[500,5],[1000,12]],recharge:[[100,1],[500,6],[1000,15]],continuous:[[1,1],[3,2],[5,3]],cumulative:[[1,1],[3,2],[7,5]],invite:[[1,1],[3,3],[5,5]]},dailyGift=1;function addMethod(id){if(methods.some(x=>x.id===id))return;const names=Object.fromEntries(catalog);const desc={continuous:'连续登录达到指定天数后赠送抽奖次数。',cumulative:'活动期间累计登录达到指定天数后赠送抽奖次数。',invite:'达到有效邀请人数后赠送抽奖次数。',firstRecharge:'会员活动期间完成首次充值后赠送抽奖次数。',register:'会员完成注册后赠送抽奖次数。',manual:'支持运营后台人工赠送抽奖次数。'};methods.push({id,name:names[id],desc:desc[id]||'',on:true});cur=id;renderChance()}function removeMethod(id){if(!confirm('确认移除此获取方式吗？'))return;methods=methods.filter(x=>x.id!==id);if(cur===id)cur=methods[0]?.id||'';renderChance()}function openAdd(){let m=ed.getElementById('methodModal');if(!m){m=ed.createElement('div');m.id='methodModal';m.className='modal';m.innerHTML='<div class="modal-box" style="width:720px"><div class="modal-h"><span>新增获取方式</span><span id="mc" style="cursor:pointer">×</span></div><div class="modal-b"><div class="method-picker" id="methodPicker"></div></div><div class="modal-f"><button class="btn" id="mclose">关闭</button></div></div>';ed.body.appendChild(m);m.querySelector('#mc').onclick=m.querySelector('#mclose').onclick=()=>m.style.display='none'}m.querySelector('#methodPicker').innerHTML=catalog.map(x=>'<button class="method-choice '+(methods.some(y=>y.id===x[0])?'used':'')+'" data-mid="'+x[0]+'">'+x[1]+'</button>').join('');m.querySelectorAll('[data-mid]').forEach(b=>b.onclick=()=>{if(b.classList.contains('used'))return;addMethod(b.dataset.mid);m.style.display='none'});m.style.display='flex'}function config(){if(cur==='daily')return '<div class="chance-config"><div class="chance-top" style="grid-template-columns:1fr"><div class="field"><label><span class="req">*</span>每日登录赠送抽奖次数</label><input id="dailyGift" class="input" type="number" min="1" value="'+dailyGift+'"></div></div><div class="chance-note">每日登录：会员每日完成1次登录即赠送配置次数，每天仅触发1次。</div></div>';if(['firstRecharge','register','manual'].includes(cur)){const labels={firstRecharge:'首次充值赠送抽奖次数',register:'注册赠送抽奖次数',manual:'单次后台赠送抽奖次数'};return '<div class="chance-config"><div class="chance-top" style="grid-template-columns:1fr"><div class="field"><label><span class="req">*</span>'+labels[cur]+'</label><input class="input" type="number" min="1" value="1"></div></div></div>'}let top='';let col='条件';if(cur==='bet'){col='有效投注金额（元）';top='<div class="chance-top"><div class="field"><label><span class="req">*</span>统计口径</label><select class="select"><option>活动期间累计有效投注</option><option>单日累计有效投注</option></select></div><div class="field"><label><span class="req">*</span>投注范围</label><div><label class="check"><input type="radio" name="venue" checked onchange="document.getElementById(\'venues\').style.display=\'none\'">全部场馆</label><label class="check"><input type="radio" name="venue" onchange="document.getElementById(\'venues\').style.display=\'flex\'">指定场馆</label><div id="venues" class="venue-row" style="display:none"><label class="check"><input type="checkbox">体育</label><label class="check"><input type="checkbox">电子</label><label class="check"><input type="checkbox">电竞</label><label class="check"><input type="checkbox">彩票</label><label class="check"><input type="checkbox">捕鱼</label><label class="check"><input type="checkbox">真人</label></div></div></div><div class="field"><label><span class="req">*</span>每日赠送次数上限</label><input class="input" value="200"></div></div>'}else if(cur==='recharge'){col='充值金额（元）';top='<div class="chance-top"><div class="field"><label><span class="req">*</span>统计口径</label><select class="select"><option>单日累计充值</option><option>活动期间累计充值</option></select></div><div class="field"><label><span class="req">*</span>每日赠送次数上限</label><input class="input" value="200"></div></div>'}else if(cur==='continuous')col='连续登录天数';else if(cur==='cumulative')col='累计登录天数';else if(cur==='invite'){col='有效邀请人数';top='<div class="chance-top" style="grid-template-columns:1fr"><div class="field"><label><span class="req">*</span>有效邀请条件</label><select class="select"><option>完成注册</option><option>完成首次充值</option><option>累计充值达到指定金额</option></select></div></div>'}const rr=rows[cur]||(rows[cur]=[[1,1]]);return '<div class="chance-config">'+top+'<div class="chance-note">达到多个档位时，各档位按配置分别赠送对应抽奖次数。</div><div class="toolbar"><span></span><button class="btn primary" id="tierAdd">＋ 新增档位</button></div><table class="table"><thead><tr><th>档位</th><th>'+col+'</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody>'+rr.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><input class="input small tier-a" data-i="'+i+'" value="'+r[0]+'"></td><td><input class="input small tier-b" data-i="'+i+'" value="'+r[1]+'"> 次</td><td><button class="btn danger tier-del" data-i="'+i+'">删除</button></td></tr>').join('')+'</tbody></table></div>'}function renderChance(){const at=tabs&&tabs.querySelector('.tab.on');if(!at||!at.textContent.includes('获取抽奖机会'))return;const body=ed.getElementById('body');if(!body)return;body.innerHTML='<div class="card"><div class="card-h">获取抽奖机会</div><div class="card-b"><div class="notice"><b>配置说明：</b> 同一套大转盘模板可按活动需要组合不同获取方式；前端仅展示已启用的获取方式。</div><div class="method-add"><button class="btn primary" id="addMethod">＋ 新增获取方式</button></div><div class="method-cards">'+methods.map(m=>'<div class="method"><div class="method-top"><b>'+m.name+'</b><div class="method-actions"><div class="switch '+(m.on?'':'off')+'" data-switch="'+m.id+'"></div><button class="btn danger" data-rm="'+m.id+'">移除</button></div></div><div class="method-desc">'+m.desc+'</div></div>').join('')+'</div><div class="chance-tabs">'+methods.map(m=>'<div class="chance-tab '+(cur===m.id?'on':'')+'" data-tab="'+m.id+'">'+m.name+'</div>').join('')+'</div>'+config()+'</div></div>';body.querySelector('#addMethod').onclick=openAdd;body.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{cur=x.dataset.tab;renderChance()});body.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>removeMethod(x.dataset.rm));body.querySelectorAll('[data-switch]').forEach(x=>x.onclick=()=>{const m=methods.find(y=>y.id===x.dataset.switch);m.on=!m.on;renderChance()});const dg=body.querySelector('#dailyGift');if(dg)dg.oninput=e=>dailyGift=e.target.value;const add=body.querySelector('#tierAdd');if(add)add.onclick=()=>{rows[cur].push(['',1]);renderChance()};body.querySelectorAll('.tier-del').forEach(x=>x.onclick=()=>{rows[cur].splice(+x.dataset.i,1);renderChance()});body.querySelectorAll('.tier-a').forEach(x=>x.oninput=e=>rows[cur][+e.target.dataset.i][0]=e.target.value);body.querySelectorAll('.tier-b').forEach(x=>x.oninput=e=>rows[cur][+e.target.dataset.i][1]=e.target.value)}const body=ed.getElementById('body');if(body)new MutationObserver(()=>setTimeout(renderChance,0)).observe(body,{childList:true});if(tabs)tabs.addEventListener('click',()=>setTimeout(renderChance,30),true);setTimeout(renderChance,50)}catch(e){console.error(e)}}};w.addEventListener('message',e=>{if(e.data==='closeEditor'){d.getElementById('editor').style.display='none';d.getElementById('editorFrame').src='about:blank'}})};</script></body></html>
