<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日大转盘后台</title><style>html,body,#main{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="main" src="main-v2.html"></iframe><script>const f=document.getElementById('main');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;w.openEditor=function(edit){const box=d.getElementById('editor'),ef=d.getElementById('editorFrame');box.style.display='block';ef.src='wheel-editor-v5.html?mode='+(edit?'edit':'new')+'&t='+Date.now();ef.onload=()=>{try{const ed=ef.contentDocument;const title=ed.getElementById('pageTitle');if(title){title.textContent=edit?'编辑：国庆大转盘':'新增国庆大转盘';title.style.position='absolute';title.style.left='50%';title.style.transform='translateX(-50%)';title.style.whiteSpace='nowrap';}}catch(e){}}};w.addEventListener('message',e=>{if(e.data==='closeEditor'){d.getElementById('editor').style.display='none';d.getElementById('editorFrame').src='about:blank'}})};</script></body></html>
