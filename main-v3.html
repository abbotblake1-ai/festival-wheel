<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日大转盘后台</title><style>html,body,#main{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="main" src="main-v2.html"></iframe><script>const f=document.getElementById('main');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;w.openEditor=function(edit){const box=d.getElementById('editor'),ef=d.getElementById('editorFrame');box.style.display='block';ef.src='wheel-editor-v5.html?mode='+(edit?'edit':'new')+'&t='+Date.now();ef.onload=()=>{try{const ed=ef.contentDocument;const ew=ef.contentWindow;const title=ed.getElementById('pageTitle');if(title){title.textContent=edit?'编辑：国庆大转盘':'新增国庆大转盘';title.style.position='absolute';title.style.left='50%';title.style.transform='translateX(-50%)';title.style.whiteSpace='nowrap';}const style=ed.createElement('style');style.textContent='.tabs{grid-template-columns:repeat(6,1fr)!important}.sector-empty{color:#98a2b3}.sector-modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:120}.sector-box{width:760px;background:#fff;border-radius:12px;overflow:hidden}.sector-h{padding:20px 24px;border-bottom:1px solid #eaecf0;font-size:20px;font-weight:700;display:flex;justify-content:space-between}.sector-b{padding:20px 24px;max-height:520px;overflow:auto}.sector-row{display:grid;grid-template-columns:36px 1fr 160px;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid #eee}.sector-f{padding:16px 24px;border-top:1px solid #eaecf0;text-align:right}.sector-count{display:flex;align-items:center;gap:10px}.sector-count select{height:36px;border:1px solid #d0d5dd;border-radius:6px;padding:0 10px;background:#fff}';ed.head.appendChild(style);const removePublishTab=()=>{const tabs=ed.getElementById('tabs');if(!tabs)return;const items=[...tabs.children];if(items.length>6){items.slice(6).forEach(x=>x.remove())}};removePublishTab();new MutationObserver(removePublishTab).observe(ed.getElementById('tabs'),{childList:true});let sectors=[{name:'88元现金券',type:'现金券',vip:'VIP0-VIP11',stock:'100',prob:'1%'},{name:'50元存送券',type:'存送券',vip:'VIP0-VIP11',stock:'100',prob:'1%'},{name:'30元流水券',type:'流水券',vip:'VIP0-VIP11',stock:'100',prob:'1%'},{name:'谢谢参与',type:'谢谢参与',vip:'VIP0-VIP11',stock:'—',prob:'70%'},null,null,null,null];const library=[{name:'88元现金券',type:'现金券'},{name:'50元存送券',type:'存送券'},{name:'30元流水券',type:'流水券'},{name:'谢谢参与',type:'谢谢参与'}];function ensureSectorModal(){if(ed.getElementById('sectorModal'))return;const m=ed.createElement('div');m.id='sectorModal';m.className='sector-modal';m.innerHTML='<div class="sector-box"><div class="sector-h"><span>从奖品库添加</span><span id="sectorClose" style="cursor:pointer">×</span></div><div class="sector-b"><div style="color:#667085;margin-bottom:12px">选择奖品后，将按顺序填入空闲扇区。</div><div id="sectorLib"></div></div><div class="sector-f"><button class="btn" id="sectorCancel">取消</button> <button class="btn primary" id="sectorConfirm">确认添加</button></div></div>';ed.body.appendChild(m);m.querySelector('#sectorClose').onclick=m.querySelector('#sectorCancel').onclick=()=>m.style.display='none';m.querySelector('#sectorConfirm').onclick=()=>{const picks=[...m.querySelectorAll('.sectorPick:checked')].map(x=>+x.value);for(const idx of picks){const empty=sectors.findIndex(x=>!x);if(empty<0){alert('当前扇区已全部配置，如需更多奖品请先切换为10个扇区。');break}const p=library[idx];sectors[empty]={name:p.name,type:p.type,vip:'VIP0-VIP11',stock:p.type==='谢谢参与'?'—':'100',prob:p.type==='谢谢参与'?'0%':'1%'}}m.style.display='none';renderPrizePanel()};}function openSectorModal(){ensureSectorModal();const m=ed.getElementById('sectorModal');m.querySelector('#sectorLib').innerHTML=library.map((x,i)=>'<label class="sector-row"><input class="sectorPick" type="checkbox" value="'+i+'"><b>'+x.name+'</b><span>'+x.type+'</span></label>').join('');m.style.display='flex'}function editSector(i){const s=sectors[i];if(!s){openSectorModal();return}const prob=prompt('请输入中奖概率（例如 5%）',s.prob);if(prob===null)return;s.prob=prob||s.prob;if(s.type!=='谢谢参与'){const stock=prompt('请输入活动库存',s.stock);if(stock!==null&&stock!=='')s.stock=stock}renderPrizePanel()}function removeSector(i){if(!sectors[i])return;if(confirm('确认移除该扇区奖品吗？')){sectors[i]=null;renderPrizePanel()}}function changeSectorCount(n){n=+n;if(n===10&&sectors.length<10)while(sectors.length<10)sectors.push(null);if(n===8&&sectors.length>8){if(sectors.slice(8).some(Boolean)&&!confirm('第9、10扇区已有奖品，切换为8个后将移除，是否继续？')){renderPrizePanel();return}sectors=sectors.slice(0,8)}renderPrizePanel()}function renderPrizePanel(){const tabs=ed.getElementById('tabs');const activeTab=tabs&&tabs.querySelector('.tab.on');if(!activeTab||!activeTab.textContent.includes('奖品配置'))return;const body=ed.getElementById('body');if(!body)return;body.innerHTML='<div class="card"><div class="card-h">奖品配置</div><div class="card-b"><div class="notice">从公共奖品库选择奖品，再配置本活动库存、概率、VIP范围、有效期及流水规则。转盘默认8个扇区，也可切换为10个扇区。</div><div class="toolbar"><div class="sector-count"><b>扇区数量</b><select id="sectorCount"><option value="8" '+(sectors.length===8?'selected':'')+'>8个</option><option value="10" '+(sectors.length===10?'selected':'')+'>10个</option></select></div><button class="btn primary" id="addSectorPrize">＋ 从奖品库添加</button></div><table class="table"><thead><tr><th>扇区</th><th>奖品名称</th><th>类型</th><th>适用VIP</th><th>库存</th><th>概率</th><th>操作</th></tr></thead><tbody>'+sectors.map((s,i)=>s?'<tr><td>扇区'+(i+1)+'</td><td>'+s.name+'</td><td>'+s.type+'</td><td>'+s.vip+'</td><td>'+s.stock+'</td><td>'+s.prob+'</td><td><button class="btn" data-edit="'+i+'">编辑</button> <button class="btn danger" data-remove="'+i+'">移除</button></td></tr>':'<tr class="sector-empty"><td>扇区'+(i+1)+'</td><td>未配置</td><td>—</td><td>—</td><td>—</td><td>—</td><td><button class="btn" data-empty="'+i+'">选择奖品</button></td></tr>').join('')+'</tbody></table></div></div>';ed.getElementById('addSectorPrize').onclick=openSectorModal;ed.getElementById('sectorCount').onchange=e=>changeSectorCount(e.target.value);body.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSector(+b.dataset.edit));body.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeSector(+b.dataset.remove));body.querySelectorAll('[data-empty]').forEach(b=>b.onclick=openSectorModal)}const body=ed.getElementById('body');if(body)new MutationObserver(()=>setTimeout(renderPrizePanel,0)).observe(body,{childList:true});ed.getElementById('tabs').addEventListener('click',()=>setTimeout(renderPrizePanel,20),true);setTimeout(renderPrizePanel,30);}catch(e){console.error(e)}}};w.addEventListener('message',e=>{if(e.data==='closeEditor'){d.getElementById('editor').style.display='none';d.getElementById('editorFrame').src='about:blank'}})};</script></body></html>
