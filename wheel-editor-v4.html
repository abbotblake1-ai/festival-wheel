<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大转盘活动编辑</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:26px;font-weight:700}.sub{color:#667085;margin-top:10px}.btn{height:38px;padding:0 16px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{color:#d92d20}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:26px 0}.tab{height:48px;background:#eaecf0;display:flex;align-items:center;justify-content:center;color:#667085;cursor:pointer}.tab.on{background:#2f66e8;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:10px}.card-h{padding:18px 22px;border-bottom:1px solid #eaecf0;font-size:17px;font-weight:700}.card-b{padding:30px 42px}.form-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:26px 48px}.field{min-width:0}.field label{display:block;font-weight:600;margin-bottom:9px}.req{color:#f04438;margin-right:5px}.input,.select,.textarea,.picker-input{width:100%;border:1px solid #d0d5dd;border-radius:7px;background:#fff}.input,.select,.picker-input{height:44px;padding:0 12px}.textarea{height:98px;padding:11px 12px;resize:vertical}.picker-input{display:flex;align-items:center;justify-content:space-between;color:#98a2b3;cursor:pointer}.picker-input.filled{color:#172033}.check-row{display:flex;gap:28px;align-items:center;min-height:44px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:7px;cursor:pointer}.check input{width:16px;height:16px}.notice{max-width:1380px;margin:0 auto 20px;padding:13px 15px;background:#f8faff;border:1px solid #dbe7ff;border-radius:8px;color:#475467}.method-cards{max-width:1380px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.method{border:1px solid #84adff;background:#f8faff;border-radius:9px;padding:16px}.method-top{display:flex;justify-content:space-between;align-items:center}.method-desc{font-size:13px;color:#667085;margin-top:8px}.switch{width:42px;height:23px;border-radius:99px;background:#2563eb;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;right:2px;top:2px}.switch.off{background:#d0d5dd}.switch.off:after{right:21px}.chance-tabs{max-width:1380px;margin:0 auto;border-bottom:1px solid #eaecf0;display:flex;gap:8px}.chance-tab{padding:13px 22px;color:#667085;cursor:pointer;border-bottom:2px solid transparent}.chance-tab.on{color:#2563eb;border-color:#2563eb;font-weight:600}.chance-config{max-width:1380px;margin:18px auto 0}.chance-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;background:#f8f9fb;border:1px solid #eaecf0;border-radius:9px;padding:18px}.chance-note{margin:18px 0 8px;color:#667085}.venue-options{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.venue-chip{padding:7px 11px;border:1px solid #d0d5dd;border-radius:6px;background:#fff;cursor:pointer}.venue-chip.on{border-color:#84adff;background:#eef4ff;color:#175cd3}.toolbar{margin:14px 0;display:flex;justify-content:space-between;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eee;text-align:left}.table th{background:#fafafa;color:#667085}.small{width:130px}.upload-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}.upload-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{height:105px;border:1px dashed #b8c5d6;background:#f7f8fa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#98a2b3;cursor:pointer}.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:50;display:none}.picker{position:absolute;top:105px;left:50%;transform:translateX(-50%);width:min(1160px,92vw);background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 20px 45px rgba(16,24,40,.16);display:grid;grid-template-columns:180px 1fr}.shortcuts{border-right:1px solid #eaecf0;padding:14px 0}.shortcut{padding:14px 24px;cursor:pointer}.shortcut:hover{background:#f5f8ff;color:#2563eb}.picker-main{padding:18px 22px}.picker-top{display:grid;grid-template-columns:1fr 160px 28px 1fr 160px;gap:12px;align-items:center;margin-bottom:18px}.picker-top.single{grid-template-columns:1fr 160px}.pick-input{height:42px;border:1px solid #d0d5dd;border-radius:6px;padding:0 12px}.months{display:grid;grid-template-columns:1fr 1fr;gap:30px}.months.single{grid-template-columns:1fr}.month-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-bottom:14px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week div{padding:8px;color:#98a2b3}.day{padding:10px 0;border-radius:5px;cursor:pointer}.day:hover{background:#eef4ff}.day.muted{color:#d0d5dd}.day.sel{background:#2563eb;color:#fff}.picker-foot{border-top:1px solid #eaecf0;margin-top:18px;padding-top:16px;display:flex;justify-content:flex-end;gap:12px}.linkbtn{border:0;background:none;color:#1677ff;font-size:16px;cursor:pointer}.confirm{height:38px;border:1px solid #1677ff;background:#fff;color:#1677ff;border-radius:6px;padding:0 18px;cursor:pointer}@media(max-width:1000px){.form-grid,.upload-grid,.method-cards,.chance-top{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.picker{grid-template-columns:1fr}.shortcuts{display:none}.months{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><button class="btn" onclick="parent.postMessage('closeEditor','*')">← 返回</button> <span class="title" id="pageTitle"></span><div class="sub">节日大转盘 · 国庆节首期配置</div></div><div><button class="btn">保存草稿</button> <button class="btn primary">发布活动</button></div></div><div class="tabs" id="tabs"></div><div id="body"></div></div><div class="picker-overlay" id="pickerOverlay" onclick="if(event.target===this)closePicker()"><div class="picker"><div class="shortcuts" id="shortcuts"></div><div class="picker-main"><div class="picker-top" id="pickerTop"></div><div class="months" id="months"></div><div class="picker-foot"><button class="linkbtn" onclick="clearPicker()">清空</button><button class="confirm" onclick="confirmPicker()">确定</button></div></div></div></div><script>const names=['基础信息','参与范围','获取抽奖机会','奖品配置','页面装修','活动规则','发布确认'];let active=0,chanceTab='bet',pickerMode='range',pickerTarget='',startDate='',endDate='',singleDate='',startTime='00:00:00',endTime='23:59:59',singleTime='00:00:00';const editing=new URLSearchParams(location.search).get('mode')==='edit';pageTitle.textContent=editing?'编辑：国庆大转盘':'新增节日大转盘';const field=(label,html,req=false)=>`<div class="field"><label>${req?'<span class="req">*</span>':''}${label}</label>${html}</div>`;function renderTabs(){tabs.innerHTML=names.map((n,i)=>`<div class="tab ${active===i?'on':''}" onclick="active=${i};render()">${i+1}. ${n}</div>`).join('')}function pickerBox(id,ph){return `<div id="${id}" class="picker-input" onclick="openPicker('${id}')"><span>${ph}</span><span>▣</span></div>`}function basic(){return `<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="form-grid">${field('活动名称',`<input class="input" value="${editing?'国庆大转盘':''}" placeholder="请输入活动名称">`,true)}${field('活动进行时间',pickerBox('activityRange','开始时间 － 结束时间'),true)}${field('活动上架时间',pickerBox('publishTime','请选择时间'),true)}${field('活动说明','<textarea class="textarea" placeholder="请输入活动说明"></textarea>')}</div></div></div>`}function scope(){return `<div class="card"><div class="card-h">参与范围</div><div class="card-b"><div class="form-grid">${field('参与会员','<select class="select"><option>全部会员</option><option>指定会员</option></select>',true)}${field('VIP等级','<div class="check-row">'+Array.from({length:12},(_,i)=>`<label class="check"><input type="checkbox" checked>VIP${i}</label>`).join('')+'</div>',true)}${field('参与终端','<div class="check-row"><label class="check"><input type="checkbox" id="allTerminal" checked onchange="toggleAllTerminals(this)">全部</label><label class="check"><input type="checkbox" class="terminal" checked onchange="syncTerminalAll()">PC</label><label class="check"><input type="checkbox" class="terminal" checked onchange="syncTerminalAll()">H5</label><label class="check"><input type="checkbox" class="terminal" checked onchange="syncTerminalAll()">APP</label></div>',true)}</div></div></div>`}function toggleAllTerminals(el){document.querySelectorAll('.terminal').forEach(x=>x.checked=el.checked)}function syncTerminalAll(){const xs=[...document.querySelectorAll('.terminal')];const a=document.getElementById('allTerminal');if(a)a.checked=xs.length>0&&xs.every(x=>x.checked)}function chanceTop(){if(chanceTab==='login')return `<div class="chance-top"><div class="field"><label><span class="req">*</span>登录计算方式</label><select class="select"><option>连续登录</option><option>累计登录</option></select></div><div class="field"><label><span class="req">*</span>每日赠送次数上限</label><input class="input" value="20"></div><div class="field"><label>说明</label><input class="input" placeholder="达到节点后赠送对应次数"></div></div>`;const isBet=chanceTab==='bet';return `<div class="chance-top"><div class="field"><label><span class="req">*</span>统计口径</label><select class="select"><option>活动期间累计${isBet?'有效投注':'充值'}</option><option>每日累计${isBet?'有效投注':'充值'}</option></select></div><div class="field"><label><span class="req">*</span>${isBet?'投注范围':'充值范围'}</label><select class="select" onchange="toggleVenue(this)"><option>全部${isBet?'场馆':'渠道'}</option><option>指定${isBet?'场馆':'渠道'}</option></select><div id="venueOptions" class="venue-options" style="display:none">${isBet?['体育','电子','电竞','彩票','捕鱼','真人'].map(x=>`<span class="venue-chip" onclick="this.classList.toggle('on')">${x}</span>`).join(''):'<span class="venue-chip">渠道配置预留</span>'}</div></div><div class="field"><label><span class="req">*</span>每日赠送次数上限</label><input class="input" value="200"></div></div>`}function toggleVenue(s){const v=document.getElementById('venueOptions');if(v)v.style.display=s.value.startsWith('指定')?'flex':'none'}function chanceRows(){const rows=chanceTab==='bet'?[[100,1],[500,5],[1000,12]]:chanceTab==='recharge'?[[100,1],[500,6],[1000,15]]:[[1,1],[3,2],[5,3]];const amountTitle=chanceTab==='bet'?'有效投注金额（元）':chanceTab==='recharge'?'累计充值金额（元）':'登录天数';return `<table class="table"><thead><tr><th>档位</th><th>${amountTitle}</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><input class="input small" value="${r[0]}"></td><td><input class="input small" value="${r[1]}"> 次</td><td><button class="btn danger">删除</button></td></tr>`).join('')}</tbody></table>`}function chance(){return `<div class="card"><div class="card-h" style="display:flex;justify-content:space-between"><span>获取抽奖机会</span><span style="font-size:13px;color:#667085;font-weight:400">配置项与前端三个Tab一一对应</span></div><div class="card-b"><div class="notice"><b>配置说明：</b> 投注赠送、充值赠送、每日登录可独立开启/关闭；开启后前端展示对应Tab。</div><div class="method-cards"><div class="method"><div class="method-top"><b>投注赠送</b><div class="switch"></div></div><div class="method-desc">会员达到指定有效投注金额后，获得对应抽奖次数。</div></div><div class="method"><div class="method-top"><b>充值赠送</b><div class="switch"></div></div><div class="method-desc">会员达到指定充值金额后，获得对应抽奖次数。</div></div><div class="method"><div class="method-top"><b>每日登录</b><div class="switch"></div></div><div class="method-desc">达到登录节点后获得抽奖次数。</div></div></div><div class="chance-tabs"><div class="chance-tab ${chanceTab==='bet'?'on':''}" onclick="chanceTab='bet';render()">投注赠送</div><div class="chance-tab ${chanceTab==='recharge'?'on':''}" onclick="chanceTab='recharge';render()">充值赠送</div><div class="chance-tab ${chanceTab==='login'?'on':''}" onclick="chanceTab='login';render()">每日登录</div></div><div class="chance-config">${chanceTop()}<div class="chance-note">达到多个档位时，各档位按配置分别赠送对应抽奖次数。</div><div class="toolbar"><span></span><button class="btn primary">＋ 新增${chanceTab==='login'?'节点':'档位'}</button></div>${chanceRows()}</div></div></div>`}function prize(){return `<div class="card"><div class="card-h">奖品配置</div><div class="card-b"><div class="notice">从公共奖品库选择奖品，再配置本活动库存、概率、VIP范围、有效期及流水规则。</div><div class="toolbar"><span></span><button class="btn primary">＋ 从奖品库添加</button></div><table class="table"><thead><tr><th>排序</th><th>奖品名称</th><th>类型</th><th>适用VIP</th><th>库存</th><th>概率</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>88元现金券</td><td>现金券</td><td>VIP0-VIP11</td><td>100</td><td>1%</td><td><button class="btn">编辑</button></td></tr></tbody></table></div></div>`}const assets=['活动内页顶部图','活动背景图','幸运大转盘底座','大转盘外圈','大转盘','指针','大转盘背景图','获得抽奖机会背景图','我的抽奖机会','奖品展示'];function decor(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="upload-grid">${assets.map(a=>`<div class="field"><label><span class="req">*</span>${a}</label><div class="upload-pair"><div class="upload">＋ 上传 APP/H5</div><div class="upload">＋ 上传 Web</div></div></div>`).join('')}</div></div></div>`}function rules(){return `<div class="card"><div class="card-h">活动规则</div><div class="card-b"><div class="form-grid">${field('活动说明','<textarea class="textarea"></textarea>',true)}${field('活动规则','<textarea class="textarea"></textarea>',true)}${field('温馨提示','<textarea class="textarea"></textarea>')}${field('排序说明','<input class="input" value="数字越小越靠前">')}</div></div></div>`}function publish(){return `<div class="card"><div class="card-h">发布确认</div><div class="card-b"><div class="form-grid">${field('活动名称','<input class="input" value="国庆大转盘">')}${field('活动时间','<input class="input" placeholder="未选择">')}${field('获取抽奖机会','<input class="input" value="投注赠送、充值赠送、每日登录">')}${field('奖品数量','<input class="input" value="3 个">')}</div></div></div>`}function render(){renderTabs();body.innerHTML=[basic,scope,chance,prize,decor,rules,publish][active]();restorePickerText()}function restorePickerText(){const a=document.getElementById('activityRange'),p=document.getElementById('publishTime');if(a&&startDate&&endDate){a.classList.add('filled');a.firstElementChild.textContent=`${startDate} ${startTime} － ${endDate} ${endTime}`}if(p&&singleDate){p.classList.add('filled');p.firstElementChild.textContent=`${singleDate} ${singleTime}`}}function openPicker(id){pickerTarget=id;pickerMode=id==='activityRange'?'range':'single';shortcuts.innerHTML=['今天','昨天','最近7天','最近15天','本周','上周','本月','上月'].map(x=>`<div class="shortcut" onclick="quick('${x}')">${x}</div>`).join('');renderPicker();pickerOverlay.style.display='block'}function closePicker(){pickerOverlay.style.display='none'}function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function quick(k){const t=new Date();let s=new Date(t),e=new Date(t);if(k==='昨天'){s.setDate(s.getDate()-1);e=new Date(s)}if(k==='最近7天')s.setDate(s.getDate()-6);if(k==='最近15天')s.setDate(s.getDate()-14);if(k==='本周'){let n=(s.getDay()+6)%7;s.setDate(s.getDate()-n)}if(k==='上周'){let n=(s.getDay()+6)%7;s.setDate(s.getDate()-n-7);e=new Date(s);e.setDate(e.getDate()+6)}if(k==='本月')s=new Date(t.getFullYear(),t.getMonth(),1);if(k==='上月'){s=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0)}if(pickerMode==='single')singleDate=fmt(s);else{startDate=fmt(s);endDate=fmt(e)}renderPicker()}function renderPicker(){pickerTop.className='picker-top'+(pickerMode==='single'?' single':'');pickerTop.innerHTML=pickerMode==='range'?`<input class="pick-input" value="${startDate}" placeholder="开始日期"><input class="pick-input" value="${startTime}"><span>›</span><input class="pick-input" value="${endDate}" placeholder="结束日期"><input class="pick-input" value="${endTime}">`:`<input class="pick-input" value="${singleDate}" placeholder="选择日期"><input class="pick-input" value="${singleTime}">`;months.className='months'+(pickerMode==='single'?' single':'');months.innerHTML=monthHtml(new Date(2026,7,1),0)+(pickerMode==='range'?monthHtml(new Date(2026,8,1),1):'')}function monthHtml(d,idx){const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),offset=first.getDay();let cells='';for(let i=0;i<offset;i++)cells+=`<div class="day muted"></div>`;for(let n=1;n<=daysIn;n++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;const sel=(pickerMode==='single'&&ds===singleDate)||(pickerMode==='range'&&(ds===startDate||ds===endDate));cells+=`<div class="day ${sel?'sel':''}" onclick="pickDay('${ds}')">${n}</div>`}return `<div><div class="month-head"><span>${idx===0?'‹‹  ‹':''}</span><span>${y}年 ${m+1}月</span><span>${idx===1?'›  ››':''}</span></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="days">${cells}</div></div>`}function pickDay(ds){if(pickerMode==='single')singleDate=ds;else if(!startDate||endDate){startDate=ds;endDate=''}else endDate=ds;renderPicker()}function clearPicker(){if(pickerMode==='single')singleDate='';else{startDate='';endDate=''}renderPicker()}function confirmPicker(){if(pickerMode==='range'&&(!startDate||!endDate))return alert('请选择开始日期和结束日期');if(pickerMode==='single'&&!singleDate)return alert('请选择日期');closePicker();restorePickerText()}render();</script></body></html>
