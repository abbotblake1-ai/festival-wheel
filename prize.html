<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奖品管理</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#1f2937;font-size:14px}.app{display:flex;min-height:100vh}.side{width:190px;background:#06213a;color:#d9e2ec;position:fixed;inset:0 auto 0 0;padding:12px 0}.brand{font-size:18px;font-weight:700;color:#fff;padding:10px 16px 20px}.nav{padding:11px 22px}.sub{padding-left:42px}.active{background:#1677ff;color:#fff}.main{margin-left:190px;width:calc(100% - 190px)}.top{height:52px;background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 28px;color:#6b7280}.content{padding:20px}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:700}.panel{background:#fff;border-radius:7px;margin-top:16px;padding:20px}.notice{padding:12px 14px;background:#f6f9ff;border:1px solid #d8e6ff;border-radius:6px;margin-bottom:16px}.filters{display:flex;gap:10px;align-items:center;margin-bottom:16px}.input,.select{height:34px;border:1px solid #d1d5db;border-radius:4px;padding:0 10px}.btn{height:34px;border:1px solid #d1d5db;background:#fff;border-radius:4px;padding:0 14px;cursor:pointer}.primary{background:#1677ff;color:#fff;border-color:#1677ff}.danger{color:#ff4d4f;border-color:#ffccc7}.green{color:#52c41a;border-color:#b7eb8f}.link{color:#1677ff;border-color:#91caff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #eee;text-align:left}.table th{background:#fafafa;color:#6b7280}.ops{display:flex;gap:6px}.status{color:#52c41a;border:1px solid #b7eb8f;background:#f6ffed;padding:2px 7px}.status.off{color:#ff4d4f;border-color:#ffccc7;background:#fff2f0}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}.box{width:720px;background:#fff;border-radius:8px}.mh{padding:18px 22px;border-bottom:1px solid #eee;font-size:18px;font-weight:700;display:flex;justify-content:space-between}.mb{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;font-weight:600;margin-bottom:7px}.field input,.field select{width:100%;height:38px;border:1px solid #d1d5db;border-radius:5px;padding:0 10px}.upload{height:80px;border:1px dashed #91caff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#1677ff}.actions{text-align:right;margin-top:22px}</style></head><body><div class="app"><aside class="side"><div class="brand">VSport-Admin</div><div class="nav">⌂ 首页</div><div class="nav">🔑 密钥管理</div><div class="nav">🛠 工具管理</div><div class="nav">🖥 平台管理</div><div class="nav">🎮 游戏管理</div><div class="nav">📊 数据总览</div><div class="nav">👤 会员管理</div><div class="nav">📣 运营管理</div><div class="nav sub">◉ 活动配置管理</div><div class="nav sub" onclick="location.href='app-v3.html?v=202608110500'">运营活动列表</div><div class="nav sub">活动模板</div><div class="nav sub">广告配置</div><div class="nav sub active">奖品管理</div><div class="nav">🎁 福利中心</div><div class="nav">💰 红利发放</div></aside><main class="main"><div class="top">首页 / 运营管理 / 活动配置管理 / 奖品管理</div><div class="content"><div class="head"><div class="title">奖品管理</div><button class="btn primary" onclick="openP()">＋ 新增奖品</button></div><div class="panel"><div class="notice">公共奖品库：只维护奖品名称、奖品类型、奖品图片、状态；库存、概率、VIP范围、有效期、流水等在具体活动的“奖品配置”中设置。</div><div class="filters">奖品名称 <input id="qn" class="input" placeholder="请输入"> 奖品类型 <select id="qt" class="select"><option value="">全部</option><option>现金券</option><option>存送券</option><option>流水券</option></select> 状态 <select id="qs" class="select"><option value="">全部</option><option>启用</option><option>停用</option></select><button class="btn primary" onclick="render()">搜索</button><button class="btn" onclick="qn.value='';qt.value='';qs.value='';render()">重置</button></div><table class="table"><thead><tr><th>奖品ID</th><th>奖品名称</th><th>奖品类型</th><th>奖品图片</th><th>状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></div></main></div><div id="m" class="modal"><div class="box"><div class="mh"><span id="mt">新增奖品</span><span onclick="m.style.display='none'" style="cursor:pointer">×</span></div><div class="mb"><div class="grid"><div class="field"><label>奖品名称 *</label><input id="pn"></div><div class="field"><label>奖品类型 *</label><select id="pt"><option>现金券</option><option>存送券</option><option>流水券</option></select></div><div class="field"><label>状态</label><select id="ps"><option>启用</option><option>停用</option></select></div><div class="field"><label>奖品图片</label><div id="up" class="upload" onclick="this.textContent='✓ 已上传（点击替换）'">＋ 上传图片</div></div></div><div class="actions"><button class="btn" onclick="m.style.display='none'">取消</button> <button class="btn primary" onclick="save()">保存</button></div></div></div></div><script>let p=[{id:'P001',name:'88元现金券',type:'现金券',img:'已上传',status:'启用',locked:true},{id:'P002',name:'50元存送券',type:'存送券',img:'已上传',status:'启用'},{id:'P003',name:'30元流水券',type:'流水券',img:'已上传',status:'启用'}],edit=null;function render(){let n=qn.value.trim(),t=qt.value,s=qs.value;body.innerHTML=p.filter(x=>(!n||x.name.includes(n))&&(!t||x.type===t)&&(!s||x.status===s)).map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.type}</td><td>${x.img}</td><td><span class="status ${x.status==='停用'?'off':''}">${x.status}</span></td><td><div class="ops"><button class="btn link" onclick="openP('${x.id}')">编辑</button><button class="btn ${x.status==='启用'?'danger':'green'}" onclick="tog('${x.id}')">${x.status==='启用'?'停用':'启用'}</button><button class="btn danger" onclick="del('${x.id}')">删除</button></div></td></tr>`).join('')}function openP(id){edit=id||null;let x=id?p.find(z=>z.id===id):null;mt.textContent=id?'编辑奖品':'新增奖品';pn.value=x?x.name:'';pt.value=x?x.type:'现金券';ps.value=x?x.status:'启用';up.textContent=x&&x.img==='已上传'?'✓ 已上传（点击替换）':'＋ 上传图片';m.style.display='flex'}function save(){if(!pn.value.trim())return alert('请输入奖品名称');if(edit){let x=p.find(z=>z.id===edit);x.name=pn.value.trim();x.type=pt.value;x.status=ps.value;x.img=up.textContent.includes('已上传')?'已上传':'未上传'}else p.push({id:'P'+String(p.length+1).padStart(3,'0'),name:pn.value.trim(),type:pt.value,status:ps.value,img:up.textContent.includes('已上传')?'已上传':'未上传'});m.style.display='none';render()}function tog(id){let x=p.find(z=>z.id===id);x.status=x.status==='启用'?'停用':'启用';render()}function del(id){let x=p.find(z=>z.id===id);if(x.locked)return alert('该奖品已被活动关联，暂不可删除');if(confirm('确认删除该奖品吗？')){p=p.filter(z=>z.id!==id);render()}}render();</script></body></html>
