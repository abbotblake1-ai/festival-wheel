<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>节日转盘后台管理系统</title><style>html,body,#root{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="root" src="app-v3.html?v=202608110312"></iframe><script>const root=document.getElementById('root');root.addEventListener('load',()=>{const rd=root.contentDocument;const editorFrame=rd.getElementById('editorFrame');if(!editorFrame)return;function injectIntoEditor(){try{const midDoc=editorFrame.contentDocument;const inner=midDoc&&midDoc.getElementById('app');if(!inner)return;function apply(){try{const d=inner.contentDocument;if(!d)return;const css=d.createElement('style');css.textContent='.basic-v5{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:28px 32px}.basic-row-v5{display:grid;grid-template-columns:180px minmax(520px,820px);gap:20px;align-items:start;margin-bottom:24px}.basic-label-v5{text-align:right;font-size:15px;font-weight:600;line-height:42px;color:#344054}.req-v5{color:#f04438;margin-right:4px}.ctrl-v5{width:100%;height:42px;border:1px solid #d0d5dd;border-radius:7px;padding:0 14px;font-size:14px;background:#fff;color:#344054}.ta-v5{height:120px;padding:12px 14px;resize:vertical}.time-v5{display:flex;align-items:center;gap:10px}.time-v5 .ctrl-v5{flex:1}.sep-v5{color:#98a2b3}@media(max-width:900px){.basic-row-v5{grid-template-columns:1fr}.basic-label-v5{text-align:left;line-height:1.4}}';d.head.appendChild(css);function html(){return '<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="basic-v5" data-basic-v5="1"><div class="basic-row-v5"><div class="basic-label-v5"><span class="req-v5">*</span>活动名称</div><div><input class="ctrl-v5" placeholder="请输入活动名称"></div></div><div class="basic-row-v5"><div class="basic-label-v5"><span class="req-v5">*</span>活动进行时间</div><div class="time-v5"><input class="ctrl-v5" type="datetime-local" value="2026-10-01T00:00"><span class="sep-v5">—</span><input class="ctrl-v5" type="datetime-local" value="2026-10-07T23:59"></div></div><div class="basic-row-v5"><div class="basic-label-v5"><span class="req-v5">*</span>活动上架时间</div><div><input class="ctrl-v5" type="datetime-local" value="2026-09-30T12:00"></div></div><div class="basic-row-v5" style="margin-bottom:0"><div class="basic-label-v5">活动说明</div><div><textarea class="ctrl-v5 ta-v5" placeholder="请输入活动说明"></textarea></div></div></div></div></div>'}function sync(){const active=d.querySelector('.step.on');const box=d.getElementById('stepBody');if(active&&box&&active.textContent.includes('基础信息'))box.innerHTML=html()}d.addEventListener('click',()=>setTimeout(sync,0),true);new MutationObserver(()=>setTimeout(sync,0)).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});sync()}catch(e){console.log(e)}}if(inner.contentDocument&&inner.contentDocument.readyState==='complete')apply();inner.addEventListener('load',apply)}catch(e){console.log(e)}}editorFrame.addEventListener('load',()=>setTimeout(injectIntoEditor,80));new MutationObserver(()=>{if(editorFrame.getAttribute('src')&&editorFrame.getAttribute('src')!=='about:blank')setTimeout(injectIntoEditor,80)}).observe(editorFrame,{attributes:true,attributeFilter:['src']});});</script></body></html>
