<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>游戏场馆列表 - VSport Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23304156'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="layout" id="layout">
    <aside class="sidebar">
      <div class="logo"><span class="logo-text">VSport Admin</span></div>
      <nav class="menu" aria-label="主导航">
        <button type="button" class="menu-item" data-page="home">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span class="menu-text">首页</span>
        </button>
        <div class="menu-group open" id="gameGroup">
          <button type="button" class="menu-title" data-action="toggle-game" aria-expanded="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="menu-text">游戏管理</span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="submenu">
            <button type="button" class="submenu-item active" data-page="venues">游戏场馆</button>
          </div>
        </div>
        <button type="button" class="menu-item" data-page="merchants">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.2 10H5.2L4 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="menu-text">商户管理</span>
        </button>
        <button type="button" class="menu-item" data-page="finance">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M7 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="menu-text">财务管理</span>
        </button>
        <div class="menu-group" id="systemGroup">
          <button type="button" class="menu-title" data-action="toggle-system" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="menu-text">系统管理</span>
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="submenu">
            <button type="button" class="submenu-item" data-page="users">用户管理</button>
            <button type="button" class="submenu-item" data-page="roles">角色管理</button>
            <button type="button" class="submenu-item" data-page="menus">菜单管理</button>
            <button type="button" class="submenu-item" data-page="depts">部门管理</button>
            <button type="button" class="submenu-item" data-page="posts">岗位管理</button>
            <button type="button" class="submenu-item" data-page="dicts">字典管理</button>
            <button type="button" class="submenu-item" data-page="params">参数设置</button>
            <button type="button" class="submenu-item" data-page="logs">日志管理</button>
            <button type="button" class="submenu-item" data-page="mustread">必读管理</button>
            <button type="button" class="submenu-item" data-page="sn">SN号管理</button>
          </div>
        </div>
        <button type="button" class="menu-item" data-page="tools">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5a3.5 3.5 0 0 0-4.8 4.8L4 17v3h3l5.7-5.7a3.5 3.5 0 0 0 4.8-4.8l-2.2 2.2-2-2 2.2-2.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="menu-text">ToolsManage</span>
        </button>
        <button type="button" class="menu-item" data-page="platform">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9h17M8 4v5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="menu-text">平台管理</span>
        </button>
        <button type="button" class="menu-item" data-page="docs">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-10.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14 3.5V9h5.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="menu-text">文档管理</span>
        </button>
      </nav>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-row">
          <button type="button" class="icon-btn" data-action="collapse" aria-label="折叠菜单">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <nav class="crumb" id="crumb" aria-label="面包屑">首页 / 游戏管理 / 游戏场馆</nav>
          <h1 id="pageTitle" class="sr-only">游戏场馆列表</h1>
          <div class="header-tools">
            <span class="tool-text">预警消息</span>
            <span class="tool-text">下载列表-133</span>
            <button type="button" class="icon-btn" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
            <button type="button" class="icon-btn" aria-label="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <span class="tool-lang" aria-hidden="true">中</span>
          </div>
        </div>
        <div class="tabbar" id="tabbar"></div>
      </header>

      <div class="content">
        <section class="view" id="view-venues">
          <div class="filter-card">
            <div class="filter-row">
              <label class="filter-item">
                <span>场馆游戏</span>
                <input id="qName" class="input" type="text" placeholder="请输入场馆游戏" autocomplete="off" />
              </label>
              <div class="filter-item">
                <span>场馆类型</span>
                <div class="select" id="qType" data-value="">
                  <button type="button" class="select-trigger">
                    <span class="select-label">全部</span>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  </button>
                  <div class="select-menu" hidden>
                    <button type="button" class="select-option selected" data-value="">全部</button>
                    <button type="button" class="select-option" data-value="体育">体育</button>
                    <button type="button" class="select-option" data-value="真人">真人</button>
                    <button type="button" class="select-option" data-value="棋牌">棋牌</button>
                    <button type="button" class="select-option" data-value="彩票">彩票</button>
                    <button type="button" class="select-option" data-value="电子">电子</button>
                    <button type="button" class="select-option" data-value="电竞">电竞</button>
                  </div>
                </div>
              </div>
              <div class="filter-item">
                <span>商户平台</span>
                <div class="select" id="qMerchant" data-value="" data-empty-placeholder="1">
                  <button type="button" class="select-trigger">
                    <span class="select-label placeholder">请选择</span>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  </button>
                  <div class="select-menu" id="qMerchantMenu" hidden></div>
                </div>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn-primary" data-action="search">
                  <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  搜索
                </button>
                <button type="button" class="btn" data-action="reset">
                  <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19.5 4.5V9H15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  重置
                </button>
              </div>
            </div>
            <div class="filter-row">
              <div class="filter-item">
                <span>更新时间</span>
                <div class="daterange">
                  <svg class="cal-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5V7M16 3.5V7M4 10h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                  <input id="qStart" class="date-input" type="text" placeholder="开始时间" autocomplete="off" />
                  <span class="sep">至</span>
                  <input id="qEnd" class="date-input" type="text" placeholder="结束时间" autocomplete="off" />
                </div>
              </div>
            </div>
          </div>

          <div class="toolbar">
            <button type="button" class="btn btn-success-plain" data-action="clear-cache">清空缓存</button>
            <button type="button" class="btn" data-action="export">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 11l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              导出
            </button>
          </div>

          <div class="table-wrap">
            <table class="grid">
              <colgroup>
                <col class="c-idx" />
                <col class="c-name" />
                <col class="c-app" />
                <col class="c-type" />
                <col class="c-code" />
                <col class="c-merchant" />
                <col class="c-user" />
                <col class="c-remark" />
                <col class="c-time" />
                <col class="c-ops" />
              </colgroup>
              <thead>
                <tr>
                  <th class="center">序号</th>
                  <th>场馆游戏</th>
                  <th>所属应用</th>
                  <th>场馆类型</th>
                  <th>场馆编码</th>
                  <th>商户平台</th>
                  <th>更新创建人</th>
                  <th>备注</th>
                  <th>最后操作时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="venueTbody"></tbody>
            </table>
          </div>
        </section>

        <section class="view" id="view-home" hidden>
          <div class="placeholder-card">
            <h2>首页</h2>
            <p>欢迎使用 VSport Admin</p>
          </div>
        </section>
        <section class="view" id="view-merchants" hidden>
          <div class="placeholder-card">
            <h2>商户管理</h2>
            <p>功能建设中</p>
          </div>
        </section>
        <section class="view" id="view-finance" hidden>
          <div class="placeholder-card">
            <h2>财务管理</h2>
            <p>功能建设中</p>
          </div>
        </section>
        <section class="view" id="view-system" hidden>
          <div class="placeholder-card">
            <h2>系统管理</h2>
            <p>功能建设中</p>
          </div>
        </section>

        <section class="view" id="view-sn" hidden>
          <div class="filter-card">
            <div class="filter-row">
              <label class="filter-item">
                <span>SN号</span>
                <input id="snQuery" class="input" type="text" placeholder="SN号不能为空" autocomplete="off" />
              </label>
              <div class="filter-item">
                <span>状态</span>
                <div class="select" id="snStatus" data-value="" data-empty-placeholder="1">
                  <button type="button" class="select-trigger">
                    <span class="select-label placeholder">状态</span>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                  </button>
                  <div class="select-menu" hidden>
                    <button type="button" class="select-option selected" data-value="">状态</button>
                    <button type="button" class="select-option" data-value="正常">正常</button>
                    <button type="button" class="select-option" data-value="停用">停用</button>
                  </div>
                </div>
              </div>
              <button type="button" class="btn btn-primary" data-action="sn-search">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                搜索
              </button>
              <button type="button" class="btn" data-action="sn-reset">重置</button>
            </div>
          </div>
          <div class="toolbar left">
            <button type="button" class="btn btn-plain-primary" data-action="sn-add">新增</button>
            <button type="button" class="btn btn-plain-danger" data-action="sn-delete-selected">删除</button>
          </div>
          <div class="table-wrap">
            <table class="grid sn-grid">
              <thead>
                <tr>
                  <th class="center"><input id="snCheckAll" type="checkbox" aria-label="全选" /></th>
                  <th>SN号</th>
                  <th>状态</th>
                  <th>创建时间</th>
                  <th>更新时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="snTbody"></tbody>
            </table>
          </div>
          <div class="pager" id="snPager"></div>
        </section>

        <section class="view" id="view-users" hidden>
          <div class="filter-card">
            <div class="filter-row">
              <label class="filter-item">
                <span>用户名称</span>
                <input id="userQuery" class="input" type="text" placeholder="请输入用户名称" autocomplete="off" />
              </label>
              <div class="filter-item">
                <span>账号类型</span>
                <div class="select" id="userType" data-value="" data-empty-placeholder="1">
                  <button type="button" class="select-trigger"><span class="select-label placeholder">请选择</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                  <div class="select-menu" hidden>
                    <button type="button" class="select-option selected" data-value="">请选择</button>
                    <button type="button" class="select-option" data-value="永久">永久</button>
                    <button type="button" class="select-option" data-value="临时">临时</button>
                  </div>
                </div>
              </div>
              <div class="filter-item">
                <span>角色</span>
                <div class="select" id="userRole" data-value="" data-empty-placeholder="1">
                  <button type="button" class="select-trigger"><span class="select-label placeholder">请选择</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                  <div class="select-menu" hidden>
                    <button type="button" class="select-option selected" data-value="">请选择</button>
                    <button type="button" class="select-option" data-value="超级管理员">超级管理员</button>
                    <button type="button" class="select-option" data-value="CTYSuper">CTYSuper</button>
                    <button type="button" class="select-option" data-value="一般管理员">一般管理员</button>
                  </div>
                </div>
              </div>
              <div class="filter-item">
                <span>创建时间</span>
                <div class="daterange">
                  <svg class="cal-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5V7M16 3.5V7M4 10h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                  <input id="userStart" class="date-input" type="text" placeholder="开始时间" autocomplete="off" />
                  <span class="sep">至</span>
                  <input id="userEnd" class="date-input" type="text" placeholder="结束时间" autocomplete="off" />
                </div>
              </div>
              <div class="filter-item">
                <span>岗位</span>
                <div class="select" id="userPost" data-value="" data-empty-placeholder="1">
                  <button type="button" class="select-trigger"><span class="select-label placeholder">请选择</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
                  <div class="select-menu" hidden>
                    <button type="button" class="select-option selected" data-value="">请选择</button>
                    <button type="button" class="select-option" data-value="主管级管理员">主管级管理员</button>
                    <button type="button" class="select-option" data-value="管理员">管理员</button>
                    <button type="button" class="select-option" data-value="运营">运营</button>
                  </div>
                </div>
              </div>
              <div class="filter-actions">
                <button type="button" class="btn btn-primary" data-action="user-search">搜索</button>
                <button type="button" class="btn" data-action="user-reset">重置</button>
              </div>
            </div>
          </div>
          <div class="toolbar left">
            <button type="button" class="btn btn-plain-primary" data-action="user-add">新增</button>
            <button type="button" class="btn btn-plain-primary" data-action="user-edit-selected">修改</button>
          </div>
          <div class="table-wrap">
            <table class="grid user-grid">
              <thead>
                <tr>
                  <th class="center"><input id="userCheckAll" type="checkbox" aria-label="全选" /></th>
                  <th>创建时间</th>
                  <th>用户名称</th>
                  <th>角色</th>
                  <th>部门</th>
                  <th>岗位</th>
                  <th>账号状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="userTbody"></tbody>
            </table>
          </div>
          <div class="pager" id="userPager"></div>
        </section>

        <section class="view" id="view-sysplaceholder" hidden>
          <div class="placeholder-card">
            <h2 id="placeholderTitle">系统管理</h2>
            <p>功能建设中</p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="modalRoot"></div>
  <div id="calendar" class="calendar" hidden></div>
  <script src="js/app.js"></script>
  <script src="js/system.js"></script>
</body>
</html>
