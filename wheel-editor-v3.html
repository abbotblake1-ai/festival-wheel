<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大转盘活动编辑</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:flex-start}.title{font-size:26px;font-weight:700}.sub{color:#667085;margin-top:10px}.btn{height:38px;padding:0 16px;border:1px solid #d0d5dd;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:26px 0}.tab{height:48px;background:#eaecf0;display:flex;align-items:center;justify-content:center;color:#667085;cursor:pointer}.tab.on{background:#2f66e8;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:10px}.card-h{padding:18px 22px;border-bottom:1px solid #eaecf0;font-size:17px;font-weight:700}.card-b{padding:30px 42px}.form-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:26px 48px}.field{min-width:0}.field label{display:block;font-weight:600;margin-bottom:9px}.req{color:#f04438;margin-right:5px}.input,.select,.textarea,.picker-input{width:100%;border:1px solid #d0d5dd;border-radius:7px;background:#fff}.input,.select,.picker-input{height:44px;padding:0 12px}.textarea{height:98px;padding:11px 12px;resize:vertical}.picker-input{display:flex;align-items:center;justify-content:space-between;color:#98a2b3;cursor:pointer}.picker-input.filled{color:#172033}.calendar-icon{font-size:18px}.notice{max-width:1380px;margin:0 auto 20px;padding:13px 15px;background:#f8faff;border:1px solid #dbe7ff;border-radius:8px;color:#475467}.table-wrap{max-width:1380px;margin:0 auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid #eee;text-align:left}.table th{background:#fafafa;color:#667085}.toolbar{max-width:1380px;margin:14px auto;display:flex;justify-content:space-between;align-items:center}.method-cards{max-width:1380px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.method{border:1px solid #84adff;background:#f8faff;border-radius:9px;padding:16px}.switch{width:42px;height:23px;border-radius:99px;background:#2563eb;position:relative}.switch:after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;right:2px;top:2px}.method-top{display:flex;justify-content:space-between}.upload-grid{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px 48px}.upload-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload{height:105px;border:1px dashed #b8c5d6;background:#f7f8fa;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#98a2b3;cursor:pointer}.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:50;display:none}.picker{position:absolute;top:105px;left:50%;transform:translateX(-50%);width:min(1160px,92vw);background:#fff;border:1px solid #d0d5dd;border-radius:10px;box-shadow:0 20px 45px rgba(16,24,40,.16);display:grid;grid-template-columns:180px 1fr}.shortcuts{border-right:1px solid #eaecf0;padding:14px 0}.shortcut{padding:14px 24px;cursor:pointer}.shortcut:hover{background:#f5f8ff;color:#2563eb}.picker-main{padding:18px 22px}.picker-top{display:grid;grid-template-columns:1fr 160px 28px 1fr 160px;gap:12px;align-items:center;margin-bottom:18px}.picker-top.single{grid-template-columns:1fr 160px}.pick-input{height:42px;border:1px solid #d0d5dd;border-radius:6px;padding:0 12px}.months{display:grid;grid-template-columns:1fr 1fr;gap:30px}.months.single{grid-template-columns:1fr}.month-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;margin-bottom:14px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week div{padding:8px;color:#98a2b3}.day{padding:10px 0;border-radius:5px;cursor:pointer}.day:hover{background:#eef4ff}.day.muted{color:#d0d5dd}.day.sel{background:#2563eb;color:#fff}.picker-foot{border-top:1px solid #eaecf0;margin-top:18px;padding-top:16px;display:flex;justify-content:flex-end;gap:12px}.linkbtn{border:0;background:none;color:#1677ff;font-size:16px;cursor:pointer}.confirm{height:38px;border:1px solid #1677ff;background:#fff;color:#1677ff;border-radius:6px;padding:0 18px;cursor:pointer}@media(max-width:1000px){.form-grid,.upload-grid,.method-cards{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}.picker{grid-template-columns:1fr}.shortcuts{display:none}.months{grid-template-columns:1fr}.picker-top{grid-template-columns:1fr 120px}.picker-top>*:nth-child(n+3){display:none}}</style></head><body><div class="wrap"><div class="top"><div><button class="btn" onclick="parent.postMessage('closeEditor','*')">← 返回</button> <span class="title" id="pageTitle"></span><div class="sub">节日大转盘 · 国庆节首期配置</div></div><div><button class="btn">保存草稿</button> <button class="btn primary">发布活动</button></div></div><div class="tabs" id="tabs"></div><div id="body"></div></div><div class="picker-overlay" id="pickerOverlay" onclick="if(event.target===this)closePicker()"><div class="picker"><div class="shortcuts" id="shortcuts"></div><div class="picker-main"><div class="picker-top" id="pickerTop"></div><div class="months" id="months"></div><div class="picker-foot"><button class="linkbtn" onclick="clearPicker()">清空</button><button class="confirm" onclick="confirmPicker()">确定</button></div></div></div></div><script>const names=['基础信息','参与范围','获取抽奖机会','奖品配置','页面装修','活动规则','发布确认'];let active=0,pickerMode='range',pickerTarget='',startDate='',endDate='',singleDate='',startTime='00:00:00',endTime='23:59:59',singleTime='00:00:00';const editing=new URLSearchParams(location.search).get('mode')==='edit';pageTitle.textContent=editing?'编辑：国庆大转盘':'新增节日大转盘';const field=(label,html,req=false)=>`<div class="field"><label>${req?'<span class="req">*</span>':''}${label}</label>${html}</div>`;function renderTabs(){tabs.innerHTML=names.map((n,i)=>`<div class="tab ${active===i?'on':''}" onclick="active=${i};render()">${i+1}. ${n}</div>`).join('')}function pickerBox(id,ph){return `<div id="${id}" class="picker-input" onclick="openPicker('${id}')"><span>${ph}</span><span class="calendar-icon">▣</span></div>`}function basic(){return `<div class="card"><div class="card-h">基础信息</div><div class="card-b"><div class="form-grid">${field('活动名称',`<input class="input" value="${editing?'国庆大转盘':''}" placeholder="请输入活动名称">`,true)}${field('活动进行时间',pickerBox('activityRange','开始时间 － 结束时间'),true)}${field('活动上架时间',pickerBox('publishTime','请选择时间'),true)}${field('活动说明','<textarea class="textarea" placeholder="请输入活动说明"></textarea>')}</div></div></div>`}function scope(){return `<div class="card"><div class="card-h">参与范围</div><div class="card-b"><div class="form-grid">${field('参与会员','<select class="select"><option>全部会员</option><option>指定会员</option></select>',true)}${field('VIP等级','<select class="select"><option>VIP0-VIP11</option></select>',true)}${field('参与终端','<select class="select"><option>全部终端</option><option>APP/H5</option><option>Web</option></select>')}${field('参与地区','<select class="select"><option>全部地区</option></select>')}</div></div></div>`}function chance(){return `<div class="card"><div class="card-h">获取抽奖机会</div><div class="card-b"><div class="notice">投注赠送、充值赠送、每日登录可独立开启/关闭；开启后前端展示对应Tab。</div><div class="method-cards"><div class="method"><div class="method-top"><b>投注赠送</b><div class="switch"></div></div></div><div class="method"><div class="method-top"><b>充值赠送</b><div class="switch"></div></div></div><div class="method"><div class="method-top"><b>每日登录</b><div class="switch"></div></div></div></div><div class="form-grid">${field('统计口径','<select class="select"><option>活动期间累计有效投注</option><option>每日累计有效投注</option></select>',true)}${field('投注范围','<select class="select"><option>全部场馆</option><option>指定场馆</option></select>',true)}${field('每日赠送次数上限','<input class="input" value="200">',true)}${field('说明','<input class="input" placeholder="达到多个档位时按配置分别赠送">')}</div><div class="toolbar"><span></span><button class="btn primary">＋ 新增档位</button></div><div class="table-wrap"><table class="table"><thead><tr><th>档位</th><th>有效投注金额</th><th>赠送抽奖次数</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>100</td><td>1 次</td><td><button class="btn">删除</button></td></tr></tbody></table></div></div></div>`}function prize(){return `<div class="card"><div class="card-h">奖品配置</div><div class="card-b"><div class="notice">从公共奖品库选择奖品，再配置本活动库存、概率、VIP范围、有效期及流水规则。</div><div class="toolbar"><span></span><button class="btn primary">＋ 从奖品库添加</button></div><div class="table-wrap"><table class="table"><thead><tr><th>排序</th><th>奖品名称</th><th>类型</th><th>适用VIP</th><th>库存</th><th>概率</th><th>操作</th></tr></thead><tbody><tr><td>1</td><td>88元现金券</td><td>现金券</td><td>VIP0-VIP11</td><td>100</td><td>1%</td><td><button class="btn">编辑</button></td></tr></tbody></table></div></div></div>`}const assets=['活动内页顶部图','活动背景图','幸运大转盘底座','大转盘外圈','大转盘','指针','大转盘背景图','获得抽奖机会背景图','我的抽奖机会','奖品展示'];function decor(){return `<div class="card"><div class="card-h">页面装修</div><div class="card-b"><div class="upload-grid">${assets.map(a=>`<div class="field"><label><span class="req">*</span>${a}</label><div class="upload-pair"><div class="upload">＋ 上传 APP/H5</div><div class="upload">＋ 上传 Web</div></div></div>`).join('')}</div></div></div>`}function rules(){return `<div class="card"><div class="card-h">活动规则</div><div class="card-b"><div class="form-grid">${field('活动说明','<textarea class="textarea"></textarea>',true)}${field('活动规则','<textarea class="textarea"></textarea>',true)}${field('温馨提示','<textarea class="textarea"></textarea>')}${field('排序说明','<input class="input" value="数字越小越靠前">')}</div></div></div>`}function publish(){return `<div class="card"><div class="card-h">发布确认</div><div class="card-b"><div class="form-grid">${field('活动名称','<input class="input" value="国庆大转盘">')}${field('活动时间','<input class="input" placeholder="未选择">')}${field('获取抽奖机会','<input class="input" value="投注赠送、充值赠送、每日登录">')}${field('奖品数量','<input class="input" value="3 个">')}</div></div></div>`}function render(){renderTabs();body.innerHTML=[basic,scope,chance,prize,decor,rules,publish][active]();restorePickerText()}function restorePickerText(){const a=document.getElementById('activityRange'),p=document.getElementById('publishTime');if(a&&startDate&&endDate){a.classList.add('filled');a.firstElementChild.textContent=`${startDate} ${startTime} － ${endDate} ${endTime}`}if(p&&singleDate){p.classList.add('filled');p.firstElementChild.textContent=`${singleDate} ${singleTime}`}}function openPicker(id){pickerTarget=id;pickerMode=id==='activityRange'?'range':'single';shortcuts.innerHTML=['今天','昨天','最近7天','最近15天','本周','上周','本月','上月'].map(x=>`<div class="shortcut" onclick="quick('${x}')">${x}</div>`).join('');renderPicker();pickerOverlay.style.display='block'}function closePicker(){pickerOverlay.style.display='none'}function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function quick(k){const t=new Date(),d=new Date(t);let s=new Date(t),e=new Date(t);if(k==='昨天'){s.setDate(s.getDate()-1);e=new Date(s)}if(k==='最近7天')s.setDate(s.getDate()-6);if(k==='最近15天')s.setDate(s.getDate()-14);if(k==='本周'){let n=(s.getDay()+6)%7;s.setDate(s.getDate()-n)}if(k==='上周'){let n=(s.getDay()+6)%7;s.setDate(s.getDate()-n-7);e=new Date(s);e.setDate(e.getDate()+6)}if(k==='本月')s=new Date(t.getFullYear(),t.getMonth(),1);if(k==='上月'){s=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0)}if(pickerMode==='single')singleDate=fmt(s);else{startDate=fmt(s);endDate=fmt(e)}renderPicker()}function renderPicker(){pickerTop.className='picker-top'+(pickerMode==='single'?' single':'');pickerTop.innerHTML=pickerMode==='range'?`<input class="pick-input" value="${startDate}" placeholder="开始日期" readonly><input class="pick-input" value="${startTime}"><span>›</span><input class="pick-input" value="${endDate}" placeholder="结束日期" readonly><input class="pick-input" value="${endTime}">`:`<input class="pick-input" value="${singleDate}" placeholder="选择日期" readonly><input class="pick-input" value="${singleTime}">`;months.className='months'+(pickerMode==='single'?' single':'');const now=new Date();months.innerHTML=monthHtml(now.getFullYear(),now.getMonth(),0)+(pickerMode==='range'?monthHtml(now.getFullYear(),now.getMonth()+1,1):'')}function monthHtml(y,m,idx){const first=new Date(y,m,1),last=new Date(y,m+1,0),prev=new Date(y,m,0);let cells='';const offset=first.getDay();for(let i=offset-1;i>=0;i--)cells+=`<div class="day muted">${prev.getDate()-i}</div>`;for(let d=1;d<=last.getDate();d++){const ds=fmt(new Date(y,m,d));let sel=pickerMode==='single'?singleDate===ds:(startDate===ds||endDate===ds);cells+=`<div class="day ${sel?'sel':''}" onclick="pickDay('${ds}')">${d}</div>`}while((offset+last.getDate())%7!==0){let n=7-((offset+last.getDate())%7);for(let i=1;i<=n;i++)cells+=`<div class="day muted">${i}</div>`;break}return `<div><div class="month-head"><span>${idx===0?'‹':''}</span><span>${y}年 ${m+1}月</span><span>${idx===1?'›':''}</span></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="days">${cells}</div></div>`}function pickDay(ds){if(pickerMode==='single')singleDate=ds;else if(!startDate||endDate){startDate=ds;endDate=''}else{endDate=ds;if(endDate<startDate){const t=startDate;startDate=endDate;endDate=t}}renderPicker()}function clearPicker(){if(pickerMode==='single')singleDate='';else{startDate='';endDate=''}renderPicker()}function confirmPicker(){if(pickerMode==='range'&&(!startDate||!endDate))return alert('请选择开始日期和结束日期');if(pickerMode==='single'&&!singleDate)return alert('请选择日期');closePicker();restorePickerText()}render();</script></body></html>
