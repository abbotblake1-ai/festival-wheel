<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>大转盘活动配置</title><style>html,body,#wrap{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="wrap" src="app-v2.html?v=202608110300"></iframe><script>const outer=document.getElementById('wrap');function patch(){try{const od=outer.contentDocument,inner=od&&od.getElementById('app');if(!inner)return;const run=()=>{try{const d=inner.contentDocument;if(!d)return;const steps=[...d.querySelectorAll('.step')];const active=steps.find(x=>x.classList.contains('on'));const box=d.getElementById('stepBody');if(!active||!box)return;if(active.textContent.includes('基础信息')&&!box.querySelector('[data-basic-real]')){box.innerHTML=`<div data-basic-real="1" class="card"><div class="card-h">基础信息</div><div class="card-b"><div style="max-width:1180px;padding:8px 4px"><div style="display:grid;grid-template-columns:150px 1fr;gap:22px 18px;align-items:center"><div style="font-weight:600;text-align:right"><span style="color:#f04438">*</span> 活动名称</div><input class="input" style="width:100%;height:42px" placeholder="请输入活动名称"><div style="font-weight:600;text-align:right"><span style="color:#f04438">*</span> 活动进行时间</div><div style="display:flex;gap:10px;align-items:center"><input class="input" style="width:280px;height:42px" placeholder="开始时间"><span style="color:#98a2b3">—</span><input class="input" style="width:280px;height:42px" placeholder="结束时间"></div><div style="font-weight:600;text-align:right"><span style="color:#f04438">*</span> 活动上架时间</div><input class="input" style="width:570px;height:42px" placeholder="选择时间"><div style="font-weight:600;text-align:right;align-self:start;padding-top:10px">活动说明</div><textarea style="width:100%;min-height:110px;border:1px solid #d0d5dd;border-radius:7px;padding:12px;font:inherit;resize:vertical" placeholder="请输入活动说明"></textarea></div></div></div></div>`}}catch(e){}};inner.addEventListener('load',()=>{run();setTimeout(run,100)});const d=inner.contentDocument;if(d){d.addEventListener('click',()=>setTimeout(run,0),true);run();setTimeout(run,200)}}catch(e){}}outer.addEventListener('load',patch);</script></body></html>
