<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>节日转盘后台管理系统</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:40px}.card{background:#fff;border:1px solid #e8ebf1;border-radius:12px;padding:24px;margin-bottom:18px}.title{font-size:28px;font-weight:700}.muted{color:#7b8497}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.item{border:1px solid #e8ebf1;border-radius:10px;padding:18px;cursor:pointer}.item:hover{border-color:#2563eb;box-shadow:0 4px 15px #2563eb18}.tag{display:inline-block;padding:4px 8px;background:#eef3ff;color:#2563eb;border-radius:5px;font-size:12px;margin-right:5px}.btn{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:9px 15px;cursor:pointer}button{cursor:pointer}</style></head><body><div class="wrap"><div class="card"><div class="title">节日转盘后台管理系统</div><p class="muted">幸运大转盘统一模板 · PC / H5 / APP · 可配置节日、新人、场馆、充值渠道、VIP等活动</p></div><div class="card"><h3>活动模板</h3><div class="grid" id="grid"></div></div></div><script>const a=[['国庆大转盘','节日活动','充值 + 投注'],['新人大转盘','新人活动','注册 + 首充 + 首投'],['圣诞大转盘','节日活动','登录 + 充值 + 投注'],['世界杯大转盘','赛事活动','体育投注'],['体育专场大转盘','体育专场','指定体育场馆 + 投注'],['真人专场大转盘','真人专场','指定真人场馆 + 投注'],['TBPay充值大转盘','充值渠道','TBPay充值多档位'],['USDT充值大转盘','充值渠道','USDT充值多档位'],['VIP专享大转盘','VIP专享','VIP等级 + 充值/投注'],['周末狂欢大转盘','周期活动','周末充值 + 投注']];document.getElementById('grid').innerHTML=a.map(x=>`<div class="item" onclick="alert('进入：${x[0]}\n类型：${x[1]}\n获取方式：${x[2]}')"><b>${x[0]}</b><p><span class="tag">${x[1]}</span></p><span class="muted">${x[2]}</span></div>`).join('')</script></body></html>
